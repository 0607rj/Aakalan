# Local/Stage-1 stack. ./data is the single persistent volume (encrypted EBS in production).
services:
  api:
    build: ./backend
    env_file: .env
    environment:
      DATA_DIR: /data
      DATABASE_URL: sqlite:////data/app.db
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build: ./backend
    env_file: .env
    environment:
      DATA_DIR: /data
      DATABASE_URL: sqlite:////data/app.db
    volumes:
      - ./data:/data
    command: ["huey_consumer", "app.jobs.huey", "-w", "2"]
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api
