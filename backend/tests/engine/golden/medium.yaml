requirements:
  - {id: M-R01, code: REQ-001, category: functional, clarity_score: 4, text: "Online registration and empanelment of vendors across 12 categories with document upload.", source_refs: [{clause_ref: "4.1.1", page: 21}]}
  - {id: M-R02, code: REQ-002, category: functional, clarity_score: 3, text: "Configurable multi-level scrutiny, clarification and approval workflow with SLA tracking.", source_refs: [{clause_ref: "4.1.3", page: 23}]}
  - {id: M-R03, code: REQ-003, category: functional, clarity_score: 3, text: "Document management with versioning for all submitted certificates.", source_refs: [{clause_ref: "4.1.4", page: 24}]}
  - {id: M-R04, code: REQ-004, category: functional, clarity_score: 4, text: "Role-wise dashboards and 25 standard MIS reports with Excel/PDF export.", source_refs: [{clause_ref: "4.2.1", page: 26}]}
  - {id: M-R05, code: REQ-005, category: functional, clarity_score: 2, text: "An AI chatbot shall answer vendor and citizen queries using the PSU's policies and circulars, in English and Hindi.", source_refs: [{clause_ref: "4.3.1", page: 28}]}
  - {id: M-R06, code: REQ-006, category: functional, clarity_score: 2, text: "The chatbot shall not disclose personal data and must refuse out-of-scope questions.", source_refs: [{clause_ref: "4.3.4", page: 29}]}
  - {id: M-R07, code: REQ-007, category: integration, clarity_score: 3, text: "Single sign-on for PSU staff through the existing LDAP / Parichay.", source_refs: [{clause_ref: "4.4.1", page: 31}]}
  - {id: M-R08, code: REQ-008, category: integration, clarity_score: 3, text: "Online payment of empanelment fees through the PSU's payment gateway.", source_refs: [{clause_ref: "4.4.2", page: 31}]}
  - {id: M-R09, code: REQ-009, category: integration, clarity_score: 2, text: "Integration with the PSU's SAP system for vendor master synchronisation.", source_refs: [{clause_ref: "4.4.3", page: 32}]}
  - {id: M-R10, code: REQ-010, category: integration, clarity_score: 4, text: "SMS and email notifications through NIC gateways.", source_refs: [{clause_ref: "4.4.4", page: 32}]}
  - {id: M-R11, code: REQ-011, category: NFR, clarity_score: 4, text: "99.9% availability; 50,000 registered users; 1,000 concurrent users at peak.", source_refs: [{clause_ref: "5.1", page: 35}]}
  - {id: M-R12, code: REQ-012, category: NFR, clarity_score: 4, text: "Bilingual (English, Hindi) and compliant with GIGW 3.0 and WCAG 2.1 AA.", source_refs: [{clause_ref: "5.3", page: 36}]}
  - {id: M-R13, code: REQ-013, category: NFR, clarity_score: 3, text: "Application security per OWASP ASVS L2; data encrypted at rest and in transit.", source_refs: [{clause_ref: "5.4", page: 37}]}
  - {id: M-R14, code: REQ-014, category: compliance, clarity_score: 5, text: "CERT-In empanelled security audit before go-live and annually thereafter.", source_refs: [{clause_ref: "6.2", page: 41}]}
  - {id: M-R15, code: REQ-015, category: functional, clarity_score: 3, text: "Migration of about 8,000 existing vendor records from the legacy system.", source_refs: [{clause_ref: "4.5", page: 33}]}
  - {id: M-R16, code: REQ-016, category: O&M, clarity_score: 4, text: "Three years of O&M after go-live with an 8x5 helpdesk and one onsite developer.", source_refs: [{clause_ref: "8.1", page: 47}]}
  - {id: M-R17, code: REQ-017, category: commercial, clarity_score: 5, text: "EMD of Rs 10,00,000; PBG of 3% of contract value valid till end of O&M.", source_refs: [{clause_ref: "2.6", page: 6}]}
  - {id: M-R18, code: REQ-018, category: commercial, clarity_score: 4, text: "Go-live within 7 months of the work order.", source_refs: [{clause_ref: "2.9", page: 7}]}
  - {id: M-R19, code: REQ-019, category: functional, clarity_score: 3, text: "Training for 200 departmental users at the head office and 3 regional offices.", source_refs: [{clause_ref: "7.2", page: 44}]}
  - {id: M-R20, code: REQ-020, category: functional, clarity_score: 3, text: "Grievance submission and tracking for vendors.", source_refs: [{clause_ref: "4.1.6", page: 25}]}
