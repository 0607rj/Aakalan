  - {id: L-R08, code: REQ-008, category: integration, clarity_score: 2, text: "Integration with 8 existing departmental systems and the state payment gateway.", source_refs: [{clause_ref: "5.4.3", page: 50}]}
  - {id: L-R09, code: REQ-009, category: functional, clarity_score: 3, text: "Migration of 50 lakh legacy application records.", source_refs: [{clause_ref: "5.7", page: 58}]}
  - {id: L-R10, code: REQ-010, category: O&M, clarity_score: 4, text: "Five years of O&M with 24x7 helpdesk and 3 onsite engineers.", source_refs: [{clause_ref: "9.1", page: 80}]}
