# Parameter set us-v2 (2026-10-16): us-v1 plus calibration dials from back-testing
# on real published contracts (seeds/benchmarks/). US: only 3 comparable contracts, so treat the fit as provisional.
version: us-v2
effective_date: 2026-10-16
status: active
region: us

calendar:
  source: placeholder
  pd_per_month: 22
  pd_per_year: 264
  hours_per_month: 730
  hours_per_year: 8760
  days_per_year: 365
  seconds_per_day: 86400

# Brief 7.1 seed defaults
complexity_multipliers: {low: 0.7, medium: 1.0, high: 1.5, very_high: 2.2}
complexity_source: placeholder

nfr:
  source: placeholder
  uptime_sla: {"99.0": 1.0, "99.5": 1.05, "99.9": 1.12, "99.95": 1.2}
  security_level: {standard: 1.0, high: 1.1, very_high: 1.25}
  per_additional_language: 0.04   # multiplier = 1 + 0.04 x (languages - 1), capped
  languages_cap: 1.4
  accessibility: {"false": 1.0, "true": 1.08}
  concurrency_bands:
    - {name: low, max_peak_users: 200, multiplier: 1.0, db_tier: small}
    - {name: medium, max_peak_users: 1000, multiplier: 1.05, db_tier: medium}
    - {name: high, max_peak_users: 5000, multiplier: 1.12, db_tier: large}
    - {name: very_high, max_peak_users: null, multiplier: 1.25, db_tier: large}

# Brief 7.1: share of effort AI tools save, by task type, scaled by team AI maturity.
ai_productivity:
  source: placeholder
  task_savings:
    documentation: 0.6
    crud: 0.5
    tests: 0.4
    architecture: 0.15
    integration: 0.1
    review_uat: 0.05
    pm: 0.0
    analysis: 0.3
    ui_design: 0.3
    ai_engineering: 0.2
    data_migration: 0.3
    security_testing: 0.1
    devops: 0.25
    training: 0.2
  maturity_scale: {low: 0.5, medium: 1.0, high: 1.25}
  max_saving: 0.75

task_roles:
  source: placeholder
  roles:
    analysis: role.business_analyst
    architecture: role.solution_architect
    ui_design: role.ui_ux_designer
    crud: role.developer
    integration: role.senior_developer
    ai_engineering: role.ml_engineer
    data_migration: role.data_engineer
    tests: role.qa_engineer
    security_testing: role.security_engineer
    devops: role.devops_engineer
    documentation: role.technical_writer
    review_uat: role.senior_developer
    pm: role.project_manager
    training: role.trainer

# Brief 7.3. max_team_curve is piecewise linear in build effort (person-months) with a positive
# intercept on every segment, so natural duration = effort / team never falls as scope grows.
timeline:
  source: placeholder
  min_duration_months: 2
  duration_quantum_months: 0.1
  max_team_curve:
    - {x: 0, y: 3}
    - {x: 30, y: 6}
    - {x: 120, y: 12}
    - {x: 600, y: 25}
  size_bands:
    - {name: small, max_build_pd: 1000, pm_fte: 0.5, om_pm_fte: 0.1, exit_management_pd: 10, audit_band: small}
    - {name: medium, max_build_pd: 4000, pm_fte: 1.0, om_pm_fte: 0.25, exit_management_pd: 20, audit_band: medium}
    - {name: large, max_build_pd: null, pm_fte: 2.0, om_pm_fte: 0.5, exit_management_pd: 40, audit_band: large}
  compression_curve:          # x = deadline / natural duration, y = cost multiplier
    - {x: 0.6, y: 1.4}
    - {x: 1.0, y: 1.0}
  infeasible_below_ratio: 0.5

programme:
  source: placeholder
  pm_role: role.project_manager
  steering_interval_months: 3
  steering_rate_key: other.steering_meeting
  mis_pd_per_month: 1
  mis_role: role.business_analyst
  travel_trips_per_month: 1
  travel_rate_key: travel.outstation_trip
  non_prod_environments: 2
  environment_rate_key: other.non_prod_environment.month

# Brief 7.4 hosting sizing (services/hosting)
hosting:
  source: placeholder
  pattern_by_sla: {"99.0": single, "99.5": ha, "99.9": ha, "99.95": ha_dr}
  concurrent_users_per_vcpu: 100   # v2: was 25; 25 put 10 servers behind 1,000 concurrent users
  vcpu_per_app_server: 4
  min_app_servers: {single: 1, ha: 2, ha_dr: 2}
  db_instances: {single: 1, ha: 2, ha_dr: 2}
  base_storage_gb: 50
  db_storage_gb: 20
  backup_factor: 2.0
  monthly_active_share: 0.1     # share of registered users active in a month
  transfer_mb_per_active_user_month: 50
  dr_cost_factor: 0.5
  reserved_discount: {aws: 0.3, indian_cloud: 0.2, on_prem: 0}
  forex_rate_key: forex.USD_INR
  forex_buffer: 0.0   # US: all prices are already in USD
  mb_per_gb: 1024
  gb_per_tb: 1024
  on_prem:
    source: placeholder
    server_rate_key: onprem.server.unit
    storage_tb_rate_key: onprem.storage.tb
    colocation_rate_key: onprem.colocation.rack_month
    servers_per_rack: 10
    hw_amc_percent: 0.1

ai_runtime:
  source: placeholder
  token_input_rate_key: llm_token.default.input
  token_output_rate_key: llm_token.default.output
  tokens_per_unit: 1000000
  volume_growth_per_year: 0.15
  annual_price_change: 0.0
  gpu_rate_key: gpu_hour.l4
  peak_factor: 3
  queries_per_second_per_gpu: 2
  min_gpus: {single: 1, ha: 2, ha_dr: 2}

maintenance:
  source: placeholder
  helpdesk_seats_by_users:     # seats grow sub-linearly with registered users
    - {max_users: 10000, seats: 1}
    - {max_users: 100000, seats: 2}
    - {max_users: 1000000, seats: 4}
    - {max_users: null, seats: 8}
  helpdesk_coverage_fte: {"8x5": 1.0, "24x7": 4.2}
  helpdesk_role: role.helpdesk_executive
  bugfix_share_of_build_pd: 0.06
  bugfix_role: role.developer
  patching_share_of_build_pd: 0.02
  patching_role: role.devops_engineer
  upgrade_share_of_build_pd: 0.03
  upgrade_role: role.senior_developer
  change_request_share_of_build_pd: 0.05
  change_request_role: role.developer
  annual_audit_rate_prefix: audit_fee.cert_in_annual
  ssl_rate_key: licence.ssl_certificate.year
  domain_rate_key: licence.domain.year
  rule_of_thumb_low: 0.15     # industry: annual maintenance = 15-25% of build
  rule_of_thumb_high: 0.25

go_live:
  source: placeholder
  cert_in_audit_rate_prefix: audit_fee.cert_in
  cert_in_reaudit_rate_prefix: audit_fee.cert_in_reaudit
  stqc_rate_key: audit_fee.stqc
  trainer_role: role.trainer
  training_pd_per_session: 1.5
  travel_rate_key: travel.outstation_trip
  trips_per_outstation_session: 2
  hypercare_team_fte: {role.developer: 2, role.devops_engineer: 0.5, role.project_manager: 0.25}
  pd_per_week: 5

escalation:
  source: placeholder
  labour: 0.035   # US: employment cost growth ~3-4%/yr (placeholder)
  prices: 0.03

commercial:
  source: placeholder
  cost_of_capital: 0.08   # US (placeholder)
  pbg_rate_key: bank_charge.pbg_commission
  payment_delay_months: 1   # US: monthly invoicing, net-30 (placeholder)
  ld_reserve_build_percent: 0.01
  penalty_reserve_run_percent: {"8x5": 0.01, "24x7": 0.02}
  contingency_at_clarity:     # x = average requirement clarity (1-5), y = contingency
    - {x: 1, y: 0.15}
    - {x: 5, y: 0.05}
  exit_role: role.project_manager
  gst_percent: 0.0   # US: custom software is generally not subject to sales tax (NY, TX); WA taxes it since 2025-10
  tax_label: Sales tax

uncertainty:
  source: placeholder
  default_clarity: 3
  clarity_spread:             # optimistic (down) / pessimistic (up) fraction around likely
    1: {down: 0.25, up: 0.75}
    2: {down: 0.2, up: 0.5}
    3: {down: 0.15, up: 0.35}
    4: {down: 0.12, up: 0.25}
    5: {down: 0.1, up: 0.15}
  template_match_extra_up: {none: 0.1, weak: 0.05, strong: 0.0}
  tag_extra_up: {integration: 0.25, ai: 0.2, data_migration: 0.2}
  compression_extra_up_per_unit: 1.0
  om_extra_up_per_year: 0.03
  hosting: {down: 0.1, up: 0.25}
  ai_runtime: {down: 0.4, up: 1.0}
  fixed_fee: {down: 0.05, up: 0.15}
  monte_carlo_runs: 10000
  distribution: triangular

confidence:
  source: placeholder
  weight_clarity: 0.5
  weight_template: 0.3
  weight_freshness: 0.2
  template_score: {none: 0.0, weak: 0.5, strong: 1.0}
  fresh_days: 180
  stale_days: 730
  high_threshold: 0.75
  medium_threshold: 0.5

# Questionnaire defaults. Any default used is listed as an assumption on the estimate.
defaults:
  source: placeholder
  values:
    om_years: 3
    team_ai_maturity: medium
    deadline_months: null
    uptime_sla: "99.5"
    security_level: standard
    languages: 1   # US: English only by default
    gigw_accessibility: true
    users_total: 10000
    peak_concurrent_users: 200
    documents_per_month: 1000
    avg_document_mb: 1
    chatbot_queries_per_day: 1000
    tokens_in_per_query: 2000
    tokens_out_per_query: 400
    hosting_provider: aws
    hosting_pricing: on_demand
    ai_runtime_mode: api
    licensing: open_source
    support_sla: 8x5
    onsite_resources: []
    change_request_pd_per_year: null
    cert_in_audit: true
    stqc_certification: false
    training_sessions: 4
    training_outstation_sessions: 0
    hypercare_weeks: 4
    emd_paise: 0   # US: no earnest money deposit
    emd_lock_months: 6
    pbg_percent: 0   # US: performance bonds are uncommon for software services (FAR requires them for construction)
    pbg_validity_months: null
    payment_schedule:
      - {at_build_fraction: 0.5, offset_months: 0, percent: 0.2}
      - {at_build_fraction: 1.0, offset_months: 0, percent: 0.4}
      - {at_build_fraction: 1.0, offset_months: 3, percent: 0.4}
    margin_percent: 0.10   # US: fee on cost-plus / T&M work (placeholder)
    contingency_percent: null
    gst_percent: null
    escalation_labour: null
    escalation_prices: null

# Calibration (back-test 2026-10-16): dials chosen to minimise the typical error against the
# benchmark contracts marked `use: true`; re-run with `python -m app.cli backtest --country X`.
calibration:
  source: "backtest on 3 published contracts, 2026-10-16"
  effort_multiplier: 1.4
  run_multiplier: 0.8
  backtest_projects: 3
  median_abs_error_percent: 3.6
  notes: "US: only 3 comparable contracts, so treat the fit as provisional."
