# Calibration (back-test 2026-10-16): dials chosen to minimise the typical error against the
# benchmark contracts marked `use: true`; re-run with `python -m app.cli backtest --country X`.
calibration:
  source: "should-cost: no factor fitted to market prices. Effort per block from published effort data (catalog v5); the spread between teams from ISBSG (Java h/FP P10-P90 4.8-29.4, P25-P75 5.9-15.6) and Anda, Sjoberg & Mockus 2009 (35 firms, one specification)."
  # v15: catalog v5 hours (mostly agency feature-hour tables) came to 3.8-5.0 hours per function point for whole projects without AI tools (build, launch and management; function points counted with IFPUG average weights from a reasoned count per block), against a median of 8.3 (P25 4.6, P75 15.9) in 825 finished projects in five public datasets (Desharnais 81, China 499, Kitchenham 145, Maxwell 62, Finnish 38; ISBSG Java median 6.4-8.0). x 1.4 brings them to about 6.5 h/FP: below the datasets' median, which comes from older tools.
  effort_multiplier: 1.4
  run_multiplier: 1.0
  # a ready-made product (SaaS, WordPress, Shopify, a chatbot platform) is set up and configured, not built: reasoned share of the custom build effort
  answer_effort_multiplier: {build_type: {ready_product: 0.2}}
  # how much the hours of different teams differ for the same scope, after adding up the blocks (research: about 0.7x to 1.6x of the middle estimate)
  should_cost: true
  # how much the hours of different teams differ for the same scope, after adding up the blocks (research: about 0.7x to 1.6x of the middle estimate); gives a range of about 0.75x to 1.25x of P50 (a wider, more skewed spread lifts P50 well above the planned cost)
  model_spread_by_size:
    small: {down: 0.35, up: 0.7}
    small_medium: {down: 0.35, up: 0.7}
    medium: {down: 0.35, up: 0.7}
    medium_large: {down: 0.35, up: 0.7}
    large: {down: 0.35, up: 0.7}
  model_spread:
    government: {down: 0.35, up: 0.7}
    private: {down: 0.35, up: 0.7}
    small_business: {down: 0.35, up: 0.7}
  # market check (back-test 2026-10-18, 56 Indian projects priced the way the app prices): real contract value / our P50, middle half (P25-P75) and median by size class; in-between sizes are the geometric middle of their neighbours (projects: 0)
  market_by_size:
    small: {projects: 30, low: 0.29, mid: 0.55, high: 1.0}
    small_medium: {projects: 0, low: 0.61, mid: 0.9, high: 1.66}
    medium: {projects: 17, low: 1.28, mid: 1.48, high: 2.74}
    medium_large: {projects: 0, low: 1.39, mid: 2.17, high: 4.22}
    large: {projects: 9, low: 1.51, mid: 3.19, high: 6.5}
  notes: "Should-cost: what the work should cost from its hours (checked against 825 finished projects) and rates, not what vendors charged. Small apps were bought for about half of this (median 0.55x; Indian vendors and lowest-bid tenders price below a full-effort cost); medium and large contracts cost about 1.5x and 3x more, as they carry much more than the features they list (years of operations, staff on site, hardware, change requests)."

# Third-party running costs, build-phase tools and client-paid items (new in this version).
# Prices come from the rate card (each with its source); the volumes below are assumptions.
third_party:
  source: placeholder
  services:
    - key: sms
      label: SMS messages
      rate_key: service.sms.message
      basis: monthly
      components: [notifications, integration_sms_email_gateway]
      units_per_active_user_month: 2   # OTPs and status alerts
    - key: email
      label: Email sending
      rate_key: service.email.thousand
      per_units: 1000
      basis: monthly
      components: [notifications, integration_sms_email_gateway]
      units_per_active_user_month: 10
    - key: aadhaar_ekyc
      label: Aadhaar eKYC checks
      rate_key: service.aadhaar_ekyc.check
      basis: per_user
      components: [integration_aadhaar_ekyc]
      # v12: listed for every client (paid to the provider); government departments may be exempt (open question)
      regions: [india]
      first_year_units_per_user: 1      # every user verified once when they join
      later_year_units_per_user: 0.2    # new users in later years
    - key: maps
      label: Map loads
      rate_key: service.maps.thousand_loads
      per_units: 1000
      basis: monthly
      components: [maps_location]
      units_per_active_user_month: 20
      free_units_per_month: 70000   # Google Maps free usage per month
    - key: apple_developer
      label: Apple developer account
      rate_key: service.app_store.apple_year
      basis: fixed
      components: [custom_mobile_app]
      rate_period: year
    - key: google_play
      label: Google Play registration (one-off)
      rate_key: service.app_store.google_once
      basis: fixed
      components: [custom_mobile_app]
      rate_period: one_off
    - key: waf_base
      label: Web firewall and DDoS protection
      rate_key: security.waf.base_month
      basis: fixed
      rate_period: month
      needs_cloud_hosting: true
      min_users: 10000            # medium and large systems
    - key: waf_requests
      label: Web firewall requests
      rate_key: security.waf.million_requests
      per_units: 1000000
      basis: monthly
      needs_cloud_hosting: true
      min_users: 10000
      units_per_active_user_month: 300   # page and API requests
  ai_features:
    components: [custom_ai_feature]
    calls_per_active_user_month: 20
    tokens_in_per_call: 2000
    tokens_out_per_call: 500
  dev_tools:
    ai_coding_rate_key: tools.ai_coding.seat_month
    dev_suite_rate_key: tools.dev_suite.seat_month
  translation:
    rate_key: service.translation.word
    words_per_component: 800     # labels, messages, help text and static pages per building block
    annual_update_share: 0.1
  client_paid_notes:
    - key: payment_gateway
      label: Online payment fees
      components: [integration_payment_gateway, ecommerce_storefront]
      rate_keys: [client.payment_gateway.fee]
      text: "The payment company charges about {0} of each online payment (standard plan, plus GST). The client pays this directly; it is not in this price."

# Lean delivery for private and small-business projects (new in this version): management and
# hypercare scale with the work, not the calendar (rule of thumb: project management is 10-15%
