# v15 (2026-10-18): v14 with the effort level checked against real effort: 825 finished projects (Desharnais, China, Kitchenham, Maxwell, Finnish datasets; median 8.3 hours per function point) put our hours at about 0.6-0.7x of real effort, so build effort x 1.4 (to about 6.5 h/FP, below the old datasets' median for today's faster tools).
# v14 (2026-10-18): should-cost. With catalog v5 (effort per block from published effort data) the price is no longer tuned to market prices: no size factor, and the range reflects how much teams' hours differ for the same scope.
# v13 (2026-10-18): v12 with the size factor following the feature points smoothly (no jump between project sizes) and lean project management whenever no formal reports and meetings are asked for.
# v12 (2026-10-18): v11 priced by what is built, not who orders it: no client-type factors (one size factor per project size fitted on all client types), lean delivery by project size only, and extra review of AI-written code.
# v11 (2026-10-16): v10 plus in-between project sizes (small to medium, medium to large) at the geometric middle of their neighbours.
# v10 (2026-10-16): v9 plus project size (small / medium / large) factors; small projects are delivered lean whatever the client.
# v9 (2026-10-16): v8 with AI productivity savings set from published evidence (lower than the v8 guesses).
# v8 (2026-10-16): v7 with separate calibration for private companies and for startups / small businesses.
# v7 (2026-10-16): v6 plus a simple AI model tier for chatbots and AI features.
# v6 (2026-10-16): v5 plus lean delivery and calibration for private and small-business projects.
# v5 (2026-10-16): v4 plus third-party services, build-phase tools, translation and client-paid items.
# v4: adds the 'none' AI level; calibrated with AI use matched to each contract's year.
# Parameter set v3 (2026-10-16): v2 plus calibration dials from back-testing
# on real published contracts (seeds/benchmarks/). India: one-line published scopes limit accuracy; errors range -84% to +102%.
version: v15
effective_date: 2026-10-18
status: active

calendar:
  source: placeholder
  pd_per_month: 22
  pd_per_year: 264
  hours_per_month: 730
  hours_per_year: 8760
  days_per_year: 365
  seconds_per_day: 86400

# Brief 7.1 seed defaults
complexity_multipliers: {low: 0.7, medium: 1.0, high: 1.5, very_high: 2.2}
complexity_source: placeholder

nfr:
  source: placeholder
  uptime_sla: {"99.0": 1.0, "99.5": 1.05, "99.9": 1.12, "99.95": 1.2}
  security_level: {standard: 1.0, high: 1.1, very_high: 1.25}
  per_additional_language: 0.04   # multiplier = 1 + 0.04 x (languages - 1), capped
  languages_cap: 1.4
  accessibility: {"false": 1.0, "true": 1.08}
  concurrency_bands:
    - {name: low, max_peak_users: 200, multiplier: 1.0, db_tier: small}
    - {name: medium, max_peak_users: 1000, multiplier: 1.05, db_tier: medium}
    - {name: high, max_peak_users: 5000, multiplier: 1.12, db_tier: large}
    - {name: very_high, max_peak_users: null, multiplier: 1.25, db_tier: large}

# Brief 7.1: share of effort AI tools save, by task type, scaled by team AI maturity.
ai_productivity:
  # Effort saved per task type at "medium" AI adoption (research 2026-10-16). Sources: McKinsey 2023
  # (docs 45-50%, code generation 35-45%, refactoring 20-30%, complex tasks <10%); Peng et al. 2023
  # (55.8% faster, greenfield task); Cui et al. 2025 (+26% tasks, 4,867 developers); Google RCT 2024
  # (~21% faster); METR 2025 (experienced devs 19% slower on large codebases) and 2026 update (-4%
  # to -18%, weak); DORA 2024; Faros 2025 (+91% review time); Veracode 2025 (AI code vulnerable in 45%
  # of tasks). Project-level check: Bain 2025 10-15%, TCS 20-30% gains (10-15% passed to clients).
  # Rows marked low-confidence are reasoned defaults, not measurements.
  source: "Published AI productivity studies 2023-2026 (see comment); low-confidence rows are reasoned defaults"
  task_savings:
    documentation: 0.45      # medium confidence
    crud: 0.35               # medium
    tests: 0.3               # low
    architecture: 0.05       # medium
    integration: 0.05        # medium
    review_uat: 0.0          # medium
    pm: 0.0                  # medium
    analysis: 0.15           # low
    ui_design: 0.15          # low
    ai_engineering: 0.1      # low
    data_migration: 0.25     # low
    security_testing: 0.0    # low
    devops: 0.15             # low
    training: 0.2            # low
  maturity_scale: {none: 0.0, low: 0.5, medium: 1.0, high: 1.25}  # none = no AI tools
  max_saving: 0.5            # no study shows more than about 56% on any task
  # AI-written code must still be read, tested and fixed (Faros 2025: review time +91%; Veracode
  # 2025: security flaws in 45% of AI-written tasks). With review at about a tenth of build
  # effort, +91% review is about +9% of the work, i.e. about a quarter of a typical 35% saving.
  # Low confidence: a reasoned figure, not a measurement.
  review_share_of_saved: 0.25
  review_role: role.senior_developer

task_roles:
  source: placeholder
  roles:
    analysis: role.business_analyst
    architecture: role.solution_architect
    ui_design: role.ui_ux_designer
    crud: role.developer
    integration: role.senior_developer
    ai_engineering: role.ml_engineer
    data_migration: role.data_engineer
    tests: role.qa_engineer
    security_testing: role.security_engineer
    devops: role.devops_engineer
    documentation: role.technical_writer
    review_uat: role.senior_developer
    pm: role.project_manager
    training: role.trainer

# Brief 7.3. max_team_curve is piecewise linear in build effort (person-months) with a positive
# intercept on every segment, so natural duration = effort / team never falls as scope grows.
timeline:
  source: placeholder
  min_duration_months: 2
  duration_quantum_months: 0.1
  max_team_curve:
    - {x: 0, y: 3}
    - {x: 30, y: 6}
    - {x: 120, y: 12}
    - {x: 600, y: 25}
  size_bands:
    - {name: small, max_build_pd: 1000, pm_fte: 0.5, om_pm_fte: 0.1, exit_management_pd: 10, audit_band: small}
    - {name: medium, max_build_pd: 4000, pm_fte: 1.0, om_pm_fte: 0.25, exit_management_pd: 20, audit_band: medium}
    - {name: large, max_build_pd: null, pm_fte: 2.0, om_pm_fte: 0.5, exit_management_pd: 40, audit_band: large}
  compression_curve:          # x = deadline / natural duration, y = cost multiplier
    - {x: 0.6, y: 1.4}
    - {x: 1.0, y: 1.0}
  infeasible_below_ratio: 0.5

