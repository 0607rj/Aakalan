# Rate card v9 (2026-10-23) = v8 with placeholder prices checked for high-side bias (outside
# review of the PBD and clinic estimates, OPEN_QUESTIONS 144; prices researched 2026-10-23):
# a free domain-validated SSL certificate (Let's Encrypt) beside the OV one, the OV one at a
# reseller midpoint instead of DigiCert's list price, AWS and Indian-cloud monitoring and the
# Indian-cloud managed database and bandwidth from published price lists, a test environment
# built from those cloud prices. Items with no primary source stay placeholder (on-prem,
# travel, steering meetings, licences). Everything else is v8 unchanged.
# Rate card v8 (2026-10-22) = v7 plus a commercial web address (licence.domain_commercial.year)
# for projects whose document does not ask for a .gov.in one (parameter sets v19+). Everything
# else is v7 unchanged.
# Rate card v7 (2026-10-21) = v6 with role day rates at the cost of a typical Indian company:
# salary plus 15% for office, HR, leave and bench (v6 used 33%, the cost of a large listed
# firm). 1.15 is a reasoned estimate for a small or mid-size Indian vendor, not a published
# figure; edit a role's rate in the estimate to use your own company's number. Profit is the
# estimate's margin only. Everything else is v6 unchanged.
# Rate card v6 (2026-10-21) = v5 with role day rates at a vendor's loaded COST, not its billing
# price. v5 used × 1.75 (TCS FY25 revenue ÷ employee cost), which already contains TCS's operating
# profit (24.3% operating margin, TCS Q4 FY25 press release, https://on.tcs.com/Q4FY25-PR-INR);
# the estimate then adds its own margin on top, so profit was counted twice. v6 uses
# 1.75 × (1 − 0.243) = 1.33: salary plus office, HR, leave and bench, without profit. The margin
# (parameter set or company settings) is the only profit. Everything else is v5 unchanged.
# Rate card v5 (2026-10-18) = v4 + small (2 vCPU) application servers for small apps.
# Rate card v4 (2026-10-16) = v3 + a smaller, cheaper AI model for simple chatbots.
# Rate card v3 (2026-10-16) = v2 + build-phase tools and third-party service prices.
# Rate card v2 — published public benchmarks (researched 2026-10-15), replacing v1 guesses.
# amount is in major units of `currency`. Items still marked `placeholder` had no credible
# published source; everything else carries its source and URL.
#
# Manpower method (v6): PayScale India 2026 average CTC × 1.33 ÷ 264 working days. 1.33 = TCS FY25
# revenue ÷ employee benefit expense (₹2,55,324 Cr / ₹1,45,788 Cr = 1.75) × (1 − 24.3% operating
# margin): a vendor's cost per unit of salary, including bench and overhead but not profit (the
# estimate's margin adds the profit). These are all-experience
# averages; no official government per-role rate card is published (NICSI/GeM/MeitY rates are
# per empanelment and not public).
