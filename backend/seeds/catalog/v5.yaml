    base_effort_pd: {S: 7.5, M: 20, L: 50}
    applicable_drivers: [uptime_sla, security_level, concurrency]
    source: "60 / 160 / 400 team hours, / 8 h per day; low-medium confidence; Cleveroad CRM role table (architect + tech lead 4.3%); Capers Jones 2017 (architecture and design h/FP); reasoned"
