# Component catalog v7 (2026-10-19): catalog v6 with every component and number unchanged,
# plus (a) a tech-stack `section` for every component, so readers can look at the relevant
# sections first (core and delivery apply to every project), and (b) new blocks for the most
# requested sectors (core, web, e-commerce, mobile, AI/ML), each with its published sources and a
# `url` per source. New-block hours follow the v6 method: whole-team hours for a basic / standard
# / advanced version (S / M / L) x 0.9 (whole-app design and testing priced separately) / 8 h per
# day. Where a source gives developer hours only, that is said in its citation. No source states
# whether AI tools were used, so every new block's era is unknown (no AI saving in the price,
# only in the pre-AI sensitivity run). Summary: docs/OPEN_QUESTIONS.md (124).
#
# Component catalog v6 (2026-10-19): catalog v5 with every effort number unchanged, plus where
# the numbers come from. Each component lists its sources (`evidence`, a structured rewrite of
# its `source` text) and `source_era`: whether that effort data was measured with AI coding
# tools in use. pre_ai only if every source is pre_ai; ai_assisted only if every source says so
# explicitly; anything else is unknown. The engine applies the team's AI savings only to pre_ai
# data (once), never to ai_assisted data, and to unknown data only in the separate pre-AI
# sensitivity run, never in the estimate. This corrects v5's note that its data "predates AI
# coding tools": most sources are undated vendor tables, so their era is unknown.
# `calibration_basis` records what the effort level (parameter effort_multiplier) was checked
# against; it never changes a component's source era. Summary: docs/OPEN_QUESTIONS.md (116).
#
# Component catalog v5 (2026-10-18): should-cost effort. base_effort_pd now comes from published
# effort data (whole-team hours for the block: analysis, design, build, testing, documentation;
# no project management) / 8 hours per day, instead of placeholders tuned to market prices.
# Feature-level blocks are x 0.9 because whole-app design, testing and documentation have their
# own blocks. Data predates AI coding tools: the engine applies AI savings by task on top.
# Sources per block in `source`; summary in docs/OPEN_QUESTIONS.md (114).
# Component catalog v4 = v3 + maps and location (GIS) for map, tracking and nearby-search features.
# Component catalog v3 = v2 + common private-sector modules (inventory, billing, bookings, online
# store, CRM). Catalog v2 = v1 + generic components for features outside the ready-made list
# (priced by type and size; the AI only suggests type and size, the user confirms).
# Component catalog for the v1 project type: web portal + workflow + AI chatbot (Govt/PSU).
# base_effort_pd: person-days for one instance of size S / M / L at medium complexity, before
# NFR multipliers and AI productivity savings. task_mix: share of effort by task type (sums to 1).
# Every number is an uncalibrated placeholder until outcomes are recorded (M5).
version: v7
era_rules:
  pre_ai_before_year: 2022
  source: "Provisional heuristic: AI coding assistants became generally available in mid-2022 (GitHub Copilot, June 2022), so data published or measured before 2022 may be dated pre_ai. An explicit statement or a documented workflow takes precedence over a date."
calibration_basis:
  parameter: calibration.effort_multiplier
  parameter_sets: [v15]
  method: "Four sample projects (clinic, shop, portal, large portal) priced with parameter set v14 (no multiplier) and no AI tools; their year-0 hours (build, launch, management) divided by function points and compared with the median hours per function point for the same size band in 825 finished projects. Ratios 0.42 / 0.58 / 0.76 / 0.74 (mean 0.625), so a full correction would be about 1.6; 1.4 was chosen."
  data: "Public datasets Desharnais 81, China 499, Kitchenham 145, Maxwell 62, Finnish 38: median 8.3 hours per function point; by size under 200 FP 10.2, 200-500 8.5, 500-1,000 6.4, over 1,000 6.3"
  reproducible: false
  limitations:
    - "Function points per block were counted by reasoning (IFPUG average weights), not measured; the counts and scripts are not in the repository."
    - "Project level only: four sample projects, not a check of each component; the ratio changes with size (0.42 for the small project, about 0.75 for the large ones)."
    - "1.4 instead of about 1.6 rests on an unsourced judgement ('today's tools are faster', about 12.5% lower). It does not say whether this means AI tools, so it may overlap with the AI savings."
    - "The datasets are older (before AI coding tools, older languages and processes) and differ in function-point variant and in which phases their effort covers."
    - "The multiplier also raises project management, hypercare and support, which scale with build person-days."
    - "A calibration against pre-AI totals does not make a component's own sources pre-AI: source_era follows each component's evidence only."
  source: "docs/OPEN_QUESTIONS.md 115; parameters/v15.yaml (calibration comment); P1-A review 2026-10-19"
sections:
  core: "Core: accounts, notifications, search, files and admin (every project)"
  delivery: "Project work: discovery, design, testing, security and deployment"
  web: "Websites and web apps"
  mobile: "Mobile apps"
  ecommerce: "E-commerce and marketplaces"
  business: "Business software: workflow, stock, billing, CRM, bookings"
  government: "Government services (India)"
  integrations: "Connections to other systems"
  ai_ml: "AI and machine learning"
  security: "Cyber security"
  custom: "Custom features (priced by type and size)"
