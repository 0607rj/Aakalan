custom_feature_types:
  module: {label: "Screens / module", component: custom_module}
  integration: {label: "Connection to another system", component: custom_integration}
  report: {label: "Reports / dashboard", component: custom_report}
  ai: {label: "AI feature", component: custom_ai_feature}
  mobile: {label: "Mobile app", component: custom_mobile_app}
max_custom_features: 50

# Working hours in one person-day, to show the work (and enter rates) in hours. An 8-hour
# working day (Factories Act / Shops and Establishments norm); the engine itself counts days.
hours_per_person_day: 8

# "Does this price look real?" (services/quick/reality.py, shown at the top of the results). Each
# check compares parts of the finished estimate with each other, never with market prices, and
# never changes the price. The optional AI second opinion reads the features, levels and the
# hours per feature and names concerns (wrong level, missing or unneeded feature); it gives no
# numbers. Thresholds are reasoned placeholders.
reality_check:
  source: "placeholder, reasoned: set-up work (design, login, testing, deployment) above 60% of the building means the features are a small part of the price; one feature above half of the feature work in a list of 3 or more usually means a level set too high; a year of running above the whole build is unusual for a portal; over 15 people on average is a large programme; researched blocks are low confidence (OPEN_QUESTIONS 125, 126)"
  setup_share_max: 0.6
  feature_share_max: 0.5
  feature_share_min_features: 3
  run_per_year_max_of_build: 1.0
  max_average_team: 15
  researched_share_max: 0.3
  not_sure_max: 3
  second_opinion_prompt: second_opinion_v1
  second_opinion_max_flags: 6
  # EMD check (fix 2026-10-22): GFR 2017 Rule 170(i) sets bid security at 2-5% of the
  # estimated value (https://doe.gov.in/files/circulars_document/FInal_GFR_upto_31_07_2024.pdf);
  # a price (without GST) outside that band is flagged
  emd_share_min: 0.02
  emd_share_max: 0.05
  emd_band_factor: 1   # any price outside the EMD range is flagged (the review of the PBD estimate, OPEN_QUESTIONS 135)
  # placeholder, reasoned (OPEN_QUESTIONS 176): on a portal only some registered users visit on a
  # given day and fewer of them ask the chatbot, so the average is well under one question per
  # registered user a day; above 1.0 the AI usage bill is probably overstated (the RailTel
  # estimate of 2026-10-27 had 5 a day: 5,000 a day for 1,000 users)
  chatbot_queries_per_user_max: 1.0

# Independent check (OPEN_QUESTIONS 140): a second estimate from what the system must contain,
# counted from the document itself (never from our feature list, which follows how much the
# document says), compared with the build effort before the price is shared. The AI only lists
# named items with quotes (prompts/count_system_v1.md); the code counts them and does the sums:
#   anchor_pd = (entities × pd_per_entity + Σ screens × screen_weight × pd_per_screen
#                + roles × pd_per_role + selected integrations × pd_per_integration
#                + hard problems × pd_per_hard_problem + tenancy_pd) × wrapper
#                × quality × ai_fit × clarity
# A ratio of our build effort to the anchor outside [ratio_low, ratio_high], or a price more
# than emd_block_factor outside the EMD range, needs a person to confirm before export.
# Every figure is a prior from an outside review of the PBD and clinic estimates (2026-10-22),
# not measured: calibrate on finished projects (outcomes).
independent_check:
  source: placeholder
  prompt: count_system_v1
  pd_per_entity: 6
  pd_per_screen: 3
  pd_per_role: 2
  pd_per_integration: 8          # only integrations whose provider the document names
  pd_per_hard_problem: 12
  screen_weight: {single: 1, list_detail_edit: 1.5}
  tenancy_pd: {single: 0, multi_tenant: 6, multi_region: 15}
  wrapper: 1.35                  # testing, documents and deployment around the engineering
  quality: {internal_tool: 1.0, commercial: 1.15, regulated_or_govt: 1.35}
  ai_fit: {greenfield_standard_stack: 0.88, greenfield_novel_domain: 0.95, brownfield_familiar: 1.0, large_legacy_codebase: 1.05}
  clarity: {clear: 1.0, vague: 1.1, contradictory: 1.2}
  ratio_low: 0.67
  ratio_high: 1.5
  emd_block_factor: 2
  # our project sizes as the bands' three sizes
  size_tier: {small: small, small_medium: small, medium: medium, medium_large: large, large: large}
  system_classes:
    content_site: "Content website (pages, news, documents)"
    crud_workflow: "Forms and approval workflow"
    booking_scheduling: "Booking and scheduling"
    marketplace: "Marketplace (buyers and sellers)"
    data_platform: "Data platform (reports, analytics)"
    ai_product: "AI product"
    integration_mw: "Integration middleware"
    realtime_system: "Real-time system (live tracking, chat, video)"
  # person-months for the whole build by kind of system and size: [low, high]
  bands:
    content_site:       {small: [2, 4],   medium: [5, 9],   large: [10, 18]}
    crud_workflow:      {small: [4, 7],   medium: [8, 15],  large: [16, 30]}
    booking_scheduling: {small: [6, 10],  medium: [11, 20], large: [21, 40]}
    marketplace:        {small: [10, 16], medium: [17, 30], large: [31, 60]}
    data_platform:      {small: [8, 14],  medium: [15, 28], large: [29, 55]}
    ai_product:         {small: [8, 15],  medium: [16, 30], large: [31, 60]}
    integration_mw:     {small: [5, 9],   medium: [10, 18], large: [19, 35]}
    realtime_system:    {small: [10, 18], medium: [19, 35], large: [36, 70]}
  hard_problems:
    concurrency: "Concurrency: double booking or stock contention"
    money_movement: "Money movement: reconciliation, refunds, settlement"
    tenant_isolation: "Several client organisations kept strictly apart"
    legacy_migration: "Moving data of unknown quality from an old system"
    realtime_latency: "Hard real-time or response-time guarantees"
    legacy_integration: "Connecting to an old system that cannot be tested"
    audit_evidence: "Audit evidence that must stand up to scrutiny"
    statistical_output: "Results that must be statistically right (ML, OCR, fuzzy matching)"

# The story-size check (services/quick/size_check.py, OPEN_QUESTIONS 163): the build sized from
# the document's user stories with Simple Function Points, at a published delivery rate, compared
# with our hours (without AI tools: the rates are pre-AI data). A check only, never a price.
size_check:
  sources:
    fp_per_story: "Simple Function Point method (Meli 2010; IFPUG SPM 2021): 4.6 per unspecified generic elementary process; one user story counted as one process (assumption) - https://en.wikipedia.org/wiki/The_Simple_Function_Point_method"
    fp_per_data_group: "Simple Function Point method: 7.0 per unspecified generic data group - https://en.wikipedia.org/wiki/The_Simple_Function_Point_method"
    data_groups_per_story: "placeholder: reasoned, data functions are about a quarter to a third of the function points of a business application, 7 x 0.3 / (4.6 + 7 x 0.3) = 31%; not measured"
    hours_per_fp: "ISBSG project delivery rate, new development, 300-500 FP, quality A/B, n=488: P25 4.7, median 9.8, P75 18.4 hours per FP (van Heeringen, The value of benchmarking software projects) - https://www.slideshare.net/slideshow/the-value-of-benchmarking-software-projects/28954202"
  fp_per_story: 4.6
  fp_per_data_group: 7.0
  data_groups_per_story: 0.3
  hours_per_fp: {low: 4.7, likely: 9.8, high: 18.4}
  stages: [pre_build, build, go_live]   # ISBSG effort covers planning to implementation
  min_stories: 3                         # placeholder: fewer stories, too small to judge alone
  # reasoned: the ISBSG rate is for new development; on these much is set up, not built, so
  # ours is expected below the story size and no agree / disagree verdict is given
  reuse_build_types: [cms, ready_product]
  # no document: the AI drafts user stories per feature for the user to edit and confirm; they
  # feed this check only (never a level or a price). Limits are reasoned placeholders.
  draft_prompt: draft_stories_v1
  draft_max_stories: 15
  draft_max_chars: 200
  top_features: 5

# Work every estimate already prices: the size tiers' base blocks and the run costs (backups,
# hosting, SSL). The document reader links a requirement that is only a part of one of these
# to its key, and it is not priced again as an extra (services/extraction/tender.py).
always_included:
  source: "reasoned from sizing.tiers base_components and the run-cost lines (2026-10-22)"
  items:
    - {key: accounts, label: "User accounts, login, logout, password reset, user roles and role-based permissions, user management, profile screens"}
    - {key: screens, label: "Responsive screens, menus and navigation, page and menu management in the admin, form validation, error messages, captcha"}
    - {key: design, label: "Screen and UI/UX design, look and feel, branding, style guide"}
    - {key: testing, label: "Testing, test cases, user acceptance testing, bug fixing before launch"}
    - {key: deployment, label: "Deployment, server and environment set-up, staging, CI/CD"}
    - {key: running, label: "Hosting, backups and restore, SSL certificate, domain, basic uptime monitoring"}
    - {key: manuals, label: "User manuals, admin guides, technical documentation, training of users"}

# "Not mentioned: do you need these?" on the features screen: the features most often needed
# that a short description leaves out, at most these 8 (those the description found are shown
# under "Found" instead). The kind of software only changes their order (its features first).
# Features added by a question (mobile app, other software, old data) are ticked by setting
# that question's usual answer. Reasoned list, agreed with the user (2026-10-23).
commonly_needed: [old_data, mobile_app, connect_existing, payments, notifications, dashboards, documents, search]

# The manual form's first screen (OPEN_QUESTIONS 212): "What is it for?". Each industry lists
# the features software for it usually has, offered unticked as "Popular for ..." on the
# features screen, each priced by the engine. An item is a listed feature (`feature`, shown
# with its own label) or a module the list lacks (`name`, priced as the user's own feature of
# `category` and `size`, less certain). `project_type`: the kind of software it is (the order
# of the common features, never the price); `tag`: the sector's short name (EdTech);
# `ticked`: ticked when the industry is picked (untick if not needed). Not read by the AI
# and not used on the
# document path. A "Something else" tile (no list) is always added.
industries:
  source: "reasoned (2026-11-04): the modules common e-commerce, school, online learning, healthcare, fitness, restaurant, property, logistics, travel, finance, government, SaaS and manufacturing software list on vendors' feature pages; `ticked` marks the 2-3 features the software cannot be without (agreed with the user); no prices, the engine prices each"
  items:
    - key: shop
      label: E-commerce
      tag: Online store
      hint: Products, cart, orders, stock, invoices
      project_type: store
      features:
        - {feature: online_store, why: "Product catalogue, cart and checkout", ticked: true}
        - {feature: payments, why: "Pay online with UPI, cards or wallets", ticked: true}
        - {feature: search, why: "Customers search and filter products"}
        - {feature: crm, why: "Customer list, orders per customer and follow-ups"}
        - {feature: ai_recommend, why: "Products recommended to each shopper"}
        - {feature: chat, why: "Customers chat with support"}
        - {feature: inventory, why: "Stock levels and low-stock alerts"}
        - {feature: billing, why: "GST invoices for each order"}
        - {feature: notifications, why: "Order updates by SMS, email or WhatsApp"}
        - {feature: mobile_app, why: "A shopping app"}
    - key: school
      label: School / college
      tag: School ERP
      hint: Admissions, fees, attendance, exams, parents
      project_type: business
      features:
        - {name: "Student records and classes", category: module, size: M, why: "Each student's details, class and section in one place", ticked: true, block: student_records}
        - {name: "Daily attendance", category: module, size: M, why: "Teachers mark attendance; parents see it", ticked: true, block: attendance_tracking}
        - {feature: payments, why: "Parents pay fees online", ticked: true}
        - {feature: online_forms, why: "New students apply for admission online"}
        - {name: "Exams, marks and report cards", category: module, size: L, why: "Marks entry, grades and printable report cards", block: exams_report_cards}
        - {name: "Class timetable", category: module, size: S, why: "Periods, teachers and rooms for each class", block: timetable_scheduling}
        - {name: "Homework and study material", category: module, size: S, why: "Teachers share homework and notes"}
