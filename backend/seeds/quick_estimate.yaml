# Work every estimate already prices: the size tiers' base blocks and the run costs (backups,
# hosting, SSL). The document reader links a requirement that is only a part of one of these
# to its key, and it is not priced again as an extra (services/extraction/tender.py).
always_included:
  source: "reasoned from sizing.tiers base_components and the run-cost lines (2026-10-22)"
  items:
    - {key: accounts, label: "User accounts, login, logout, password reset, user roles and role-based permissions, user management, profile screens"}
    - {key: screens, label: "Responsive screens, menus and navigation, page and menu management in the admin, form validation, error messages, captcha"}
    - {key: design, label: "Screen and UI/UX design, look and feel, branding, style guide"}
    - {key: testing, label: "Testing, test cases, user acceptance testing, bug fixing before launch"}
    - {key: deployment, label: "Deployment, server and environment set-up, staging, CI/CD"}
    - {key: running, label: "Hosting, backups and restore, SSL certificate, domain, basic uptime monitoring"}
    - {key: manuals, label: "User manuals, admin guides, technical documentation, training of users"}

# "Not mentioned: do you need these?" on the features screen: the features most often needed
# that a short description leaves out, at most these 8 (those the description found are shown
# under "Found" instead). The kind of software only changes their order (its features first).
# Features added by a question (mobile app, other software, old data) are ticked by setting
# that question's usual answer. Reasoned list, agreed with the user (2026-10-23).
commonly_needed: [old_data, mobile_app, connect_existing, payments, notifications, dashboards, documents, search]

# What a CMS already has (OPEN_QUESTIONS 154). Built on a CMS, these features, and extra
# features whose names say they are the CMS's own parts, are set up rather than built: at most
# the basic level, one module each, with `note` in the quote. Without this a tender read story
# by story prices every built-in capability of the product as work to build (the Indian Bank
# websites tender: 140 stories, 1.95x its published price). Business workflows, payments,
# integrations and data migration are not on the list: a CMS does not ship them.
cms_built_in:
  source: "placeholder: the core features of Drupal (https://www.drupal.org/docs/core-modules-and-themes/core-modules) and WordPress (https://wordpress.org/about/features/): pages and news, search, translation, media and file library, forms (Drupal Webform), editor, revisions, roles, SEO fields; the level is a guess, not measured"
  build_types: [cms]
  features: [public_website, search, languages, documents, online_forms]
  level: basic
  extra_words: [cms, content management, editor, publishing, page builder, page building, templates, microsite, microsites, versioning, revisions, archive, seo, media library]
  note: "Already part of the CMS: set up, not built."

# The standard building blocks in plain words: the form lists those of the project's size as
