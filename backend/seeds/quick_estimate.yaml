# "Usually needed for this kind of software" (OPEN_QUESTIONS 207): the AI reader names at most
# `max_items` modules the words never mention, for any industry, each with a one-line reason;
# the code keeps only listed features not found, not ruled out and not in `never`, and new
# modules whose names have none of `never_words`. Offered unticked; when there are none (no
# AI key) the fixed `commonly_needed` list is shown as before. Nothing here is a price.
industry_suggestions:
  source: "reasoned, agreed with the user (2026-11-04): up to 10 real modules a buyer would name (bus tracking, fee reminders), the most important first, fewer when fewer matter, none when the words already cover them; never the basics every project has (sign-in, a dashboard, search)"
  max_items: 10
  never: [staff_login, dashboards, search, accessibility, old_data, connect_existing]
  # whole words, any case
  never_words: [login, log in, sign in, sign-in, signup, sign up, profile, profiles, dashboard, dashboards, admin panel, admin console, settings, home page, homepage, landing page, screen, screens, button, buttons, user management, role management, password]

# What a CMS already has (OPEN_QUESTIONS 154). Built on a CMS, these features, and extra
# features whose names say they are the CMS's own parts, are set up rather than built: at most
# the basic level, one module each, with `note` in the quote. Without this a tender read story
# by story prices every built-in capability of the product as work to build (the Indian Bank
# websites tender: 140 stories, 1.95x its published price). Business workflows, payments,
# integrations and data migration are not on the list: a CMS does not ship them.
cms_built_in:
  source: "placeholder: the core features of Drupal (https://www.drupal.org/docs/core-modules-and-themes/core-modules) and WordPress (https://wordpress.org/about/features/): pages and news, search, translation, media and file library, forms (Drupal Webform), editor, revisions, roles, SEO fields; the level is a guess, not measured"
  build_types: [cms]
  features: [public_website, search, languages, documents, online_forms]
  level: basic
  extra_words: [cms, content management, editor, publishing, page builder, page building, templates, microsite, microsites, versioning, revisions, archive, seo, media library]
  note: "Already part of the CMS: set up, not built."

# The standard building blocks in plain words: the form lists those of the project's size as
# "included by default" and the user may untick one (it is then left out of the price and the
# quote says so). Labels only; what each block costs comes from the catalog.
# OPEN_QUESTIONS 211 (reasoned, agreed with the user 2026-11-04): `fixed` blocks are what every
# working software has (its screens, their design, sign-in, basic security, testing, putting it
# live): shown as "always part of the build", never unticked. The rest are usual at this size
# but a client may not need them: offered ticked, untick if not needed.
standard_blocks:
  discovery_requirement_study: {label: "Requirement study", hint: "Workshops to agree what is built, written down before work starts. Untick if the requirements are already clear and written"}
  solution_architecture: {label: "Technical design", hint: "A written plan of servers, database and security, often asked for by large clients"}
  ui_ux_design: {label: "Screen design", hint: "How every screen looks and works", fixed: true}
  user_management_rbac: {label: "Login and user roles", hint: "Login, password reset, roles and who may see what", fixed: true}
  responsive_frontend: {label: "Works on phone and computer", hint: "Menus, navigation and forms that fit any screen", fixed: true}
  audit_trail_logging: {label: "Audit log", hint: "A record of who did what and when, often needed for government and finance"}
  security_hardening: {label: "Security", hint: "Protection against common attacks", fixed: true}
  notifications: {label: "System emails", hint: "Confirmations and password reset emails the system sends"}
  integration_sms_email_gateway: {label: "SMS and email service connection", hint: "Connecting to the SMS and email provider"}
  functional_testing_uat_support: {label: "Testing before launch", hint: "Test cases, bug fixing and help while users test it", fixed: true}
  documentation_manuals: {label: "Manuals", hint: "Written user and admin guides. Untick if short help screens are enough"}
  devops_cicd_setup: {label: "Putting it live", hint: "Test and live environments, automatic deployment", fixed: true}
  performance_load_testing: {label: "Load testing", hint: "Checking it stays fast with many users at once"}
  vapt_remediation: {label: "Fixing security audit findings", hint: "Fixing what the outside security audit finds"}

# Research for a feature the catalog lacks (services/research; prompts in app/llm/prompts).
# Only with an AI key; without one the custom feature type prices it, as before. Order: a
# catalog block with a close name; else published hours from the web (the AI searches with the
# feature's name only, never tender text; the code opens each page and keeps a figure only if it
# is on the page near the feature's words; hours = lowest / median / highest kept figure x
# feature_level_factor / hours per day) when at least min_verified_sources check out; else the AI
# analysis: the feature as catalog blocks at a level, hours from those blocks (the AI gives no
# number). The block is saved for the organisation automatically (low confidence) and reused.
research:
  source: "placeholder, reasoned: limits keep a search cheap (a few searches and pages) and slow pages from blocking an estimate; feature_level_factor is the catalog v5 method; match_threshold and quote_window_chars were chosen on the catalog's own names and a few vendor pages (2026-10-19)"
  prompt: research_feature_v1
  analyse_prompt: analyse_feature_v1
  web_search: true
  min_verified_sources: 1
  max_sources: 5
  max_searches: 5
  max_per_estimate: 5
  concurrency: 3
  feature_level_factor: 0.9
  match_threshold: 0.6
  retry_no_evidence_days: 30
  # every researched feature joins the shared library (seeds/research/library.yaml) and prices
  # a matching feature typed by any company, but is never listed by name to another company
  # (OPEN_QUESTIONS 185); false: each company is priced by its own research only
  share: true
  # true: a newly shared feature prices other companies' features at once, with no approval
  # on the Admin page (the owner can still retire it there); false: it waits for the owner
  # (OPEN_QUESTIONS 214)
  auto_share: true
  fetch_timeout_seconds: 15
  fetch_max_bytes: 3000000
  quote_window_chars: 300
  min_hours: 2
  max_hours: 5000

