onsite_event_days:
  days: 5
  source: "placeholder, reasoned: a convention or launch event of about 3 days plus set-up and wind-down (2026-10-22)"

# Payment terms read by the AI reader: when each payment falls, as a point in the build
# (0 = the order, 1 = go-live) and months after it. "after_go_live" uses the months the
# document states. Placeholder points.
payment_points:
  source: placeholder
  on_order: {at_build_fraction: 0, offset_months: 0}
  during_build: {at_build_fraction: 0.5, offset_months: 0}
  go_live: {at_build_fraction: 1, offset_months: 0}
  after_go_live: {at_build_fraction: 1, offset_months: 0}

# Pre-bid queries. Vague wording and missing key facts make bidders price differently; each
# becomes a drafted query citing the clause. {clause}, {page} and {quote} are filled in.
prebid:
  vague_phrases: [as per requirement, as per the requirement, as required, adequate, suitable, appropriate number, etc., to be decided, tbd, as directed, as and when required, if required, wherever applicable, and so on, minimum but not limited to, not limited to]
  vague_query: 'Clause {clause} (page {page}) states: "{quote}". The scope or quantity here is not specified. Kindly clarify the exact requirement so that all bidders can price on the same basis.'
  missing:
    users_total: The requirement document does not state the expected number of registered users. Kindly specify the number of users the system must support at launch and at the end of the contract.
    peak_concurrent_users: The requirement document does not state the expected number of concurrent users at peak load. Kindly specify it, as it determines the hosting and performance-testing scope.
    om_years: The requirement document does not state the period of operations and maintenance after go-live. Kindly confirm the O&M / AMC period.
    deadline_months: The requirement document does not state the implementation timeline. Kindly confirm the time allowed from the date of the work order to go-live.
    availability: The requirement document does not state the required system availability (uptime SLA). Kindly specify the uptime required and whether a disaster-recovery site is in scope.
    hosting: The requirement document does not state where the system will be hosted. Kindly confirm the hosting environment (government cloud, state data centre or bidder's cloud) and who bears the hosting cost.
    support_hours: The requirement document does not state the helpdesk support hours. Kindly confirm whether support is required during office hours or round the clock.
    chatbot_queries_per_day: The requirement document asks for an AI chatbot but does not state the expected usage. Kindly indicate the expected number of chatbot queries per day and the languages to be supported.
