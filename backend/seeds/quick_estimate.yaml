# Quick estimate: plain-language features and questions for anyone pricing a piece of software.
# The price depends on WHAT is built, never on who orders it: each ticked feature becomes a
# confirmed requirement and adds catalog components at the level the user picks (Basic /
# Standard / Advanced); each simple answer sets questionnaire drivers. Things only some clients
# need (security audit, formal reports and meetings, accessibility, languages) are optional
# items with their own price. Every mapping is an uncalibrated placeholder.
version: v3
source: placeholder
# A ticked feature says *what* is needed but not how much, so clarity is neutral (1-5 scale).
requirement_clarity: 3
# Market prices (published contract values) are not shown or used to check an estimate: the
# same scope sells for up to 5x more or less (user's decision 2026-10-21, OPEN_QUESTIONS 127).
# true brings back the market box and similar real projects on the results page and report.
show_market_prices: false

# Every quick estimate starts from these answers; sizes, questions and features add to them.
# No client-type extras by default: audits, reports and meetings, accessibility, languages and
# bid deposits are only priced when asked for.
base_answers:
  governance_overheads: false
  cert_in_audit: false
  stqc_certification: false
  gigw_accessibility: false
  languages: 1
  emd_paise: 0
  pbg_percent: 0

# The first screen: what kind of software it is. The type only decides which features are
# shown first and which are ticked to start with; the price follows the ticked features alone.
project_types:
  - key: portal
    label: A website or portal for the public
    hint: "People apply, pay, upload documents or raise complaints online - e.g. a department or company portal"
    features: [online_forms, approval_workflow, documents, payments, public_website, grievances, aadhaar_digilocker, notifications, search, dashboards]
    suggested: [online_forms]
  - key: business
    label: Software for your staff
    hint: "Stock, billing, customers, approvals and reports - e.g. an office or ERP system"
    features: [inventory, billing, crm, approval_workflow, documents, dashboards, staff_login, notifications, search, ai_documents, ai_forecast]
    suggested: [dashboards]
  - key: store
    label: An online store or marketplace
    hint: "Sell products online with a cart, payments and order tracking"
    features: [online_store, marketplace, payments, search, notifications, inventory, billing, crm, maps, chat, ai_recommend]
    suggested: [online_store, payments]
  - key: booking
    label: A booking or service app
    hint: "Appointments, home services, rentals, clinics or classes"
    features: [bookings, payments, maps, notifications, crm, billing, online_forms, grievances, chat, offline_app]
    suggested: [bookings, notifications]
  - key: ai
    label: An AI chatbot, assistant or AI feature
    hint: "Answers questions, reads documents, recommends, predicts or completes tasks"
    features: [ai_chatbot, ai_documents, ai_agent, ai_voice, ai_text_sorting, ai_recommend, ai_forecast, ai_images, ai_training, documents, search, languages, dashboards, notifications]
    suggested: [ai_chatbot]
  - key: other
    label: Something else
    hint: "Choose from every feature"
    features: []

features:
  - key: online_forms
    label: Online application or registration forms
    hint: People fill forms online and upload documents instead of visiting an office.
    components: [registration_empanelment, master_data_management]
    levels:
      basic: "One or two simple forms"
      standard: "Several forms with document upload and saved drafts"
      advanced: "Many forms with rules that change by answer, fees and re-submission"
  - key: approval_workflow
    label: Files go from person to person for approval
    hint: Applications are checked and approved in steps, with time limits.
    components: [workflow_engine]
    levels:
      basic: "One approval step"
      standard: "A few steps with time limits and reminders"
      advanced: "Many steps and roles, sending back, escalation and delegation"
  - key: documents
    label: Store and manage documents
    hint: Upload, keep versions of and find certificates and files.
    components: [document_management, search_module]
    levels:
      basic: "Upload and download files"
      standard: "Folders, versions and search"
      advanced: "Large volumes, full-text search, access rules and retention"
  - key: dashboards
    label: Reports and dashboards
    hint: Charts and standard reports that can be downloaded.
    components: [dashboard_mis_reports]
    levels:
      basic: "A few fixed reports"
      standard: "A dashboard with charts, filters and downloads"
      advanced: "Many dashboards, drill-down and self-made reports"
  - key: ai_chatbot
    label: AI chatbot that answers people's questions
    hint: A chat assistant trained on your rules, documents and FAQs.
    components: [ai_chatbot_rag, ai_knowledge_ingestion, ai_guardrails_safety, ai_evaluation_set]
    levels:
      basic: "Answers FAQs from a few documents"
      standard: "Answers from many documents, with sources and hand-over to a person"
      advanced: "Several languages, looks up records and completes tasks for the user"
  - key: payments
    label: Online fee payment
    hint: Pay fees through a payment gateway.
    components: [integration_payment_gateway]
    levels:
      basic: "One payment type"
      standard: "Several fees, receipts and refunds"
      advanced: "Split payments, reconciliation with accounts, many payment methods"
  - key: aadhaar_digilocker
    label: Login or verification with Aadhaar / DigiLocker
    hint: Verify people and fetch their documents from government systems.
    components: [integration_aadhaar_ekyc, integration_digilocker]
  - key: staff_login
    label: Log in with existing accounts
    hint: Single sign-on with Google, Microsoft, the office directory or a government login (e.g. Parichay).
    components: [integration_sso_identity]
  - key: connect_existing
    hidden: true   # asked as its own question, not ticked
    label: Connect to existing systems (SAP, old software)
    hint: Share data with software the client already uses.
    components: [integration_erp_legacy]
    levels:
      basic: "One system, one direction"
      standard: "One or two systems, both directions"
      advanced: "Several systems, real-time sync and error handling"
  - key: languages
    label: Available in Indian languages
    hint: Hindi and regional languages, with translation.
    components: [multilingual_i18n, integration_bhashini_translation]
    sets: {languages: 3}
  - key: accessibility
    label: Accessible to people with disabilities (GIGW / WCAG)
    hint: Screen readers, keyboard use and readable colours; required for government websites.
    components: [accessibility_gigw_compliance]
    sets: {gigw_accessibility: true}
  - key: public_website
    label: Public website with notices and news
    hint: Pages the public can read, updated by staff.
    components: [cms_public_website]
    levels:
      basic: "A few pages"
      standard: "Many pages, news and notices updated by staff"
      advanced: "Large site with many sections, editors and approvals"
  - key: grievances
    label: Complaints and helpdesk tickets
    hint: People raise complaints and track them.
    components: [grievance_helpdesk]
    levels:
      basic: "Raise and close a complaint"
      standard: "Categories, assignment, time limits and feedback"
      advanced: "Escalation across offices, reports and links to other systems"
  - key: inventory
    label: Stock / inventory management
    hint: Items, stock in and out, locations, low-stock alerts (e.g. books in a library, products in a shop).
    components: [inventory_management]
    levels:
      basic: "One location, stock in and out"
      standard: "Several locations, alerts and reports"
      advanced: "Warehouses, barcodes, batches and purchase orders"
  - key: billing
    label: Billing and invoices
    hint: Quotes, invoices with tax, receipts and statements.
    components: [billing_invoicing]
    levels:
      basic: "Simple invoices"
      standard: "Quotes, tax invoices, receipts and statements"
      advanced: "Subscriptions, credit notes and accounting export"
  - key: bookings
    label: Bookings / appointments
    hint: Calendars and slots - book, reschedule, cancel, reminders.
    components: [booking_appointments]
    levels:
      basic: "One calendar, book and cancel"
      standard: "Several staff or rooms, reminders and rescheduling"
      advanced: "Many branches, waiting lists, payments and rules"
  - key: online_store
    label: Online store
    hint: Product catalogue, cart, checkout and order tracking.
    components: [ecommerce_storefront, integration_payment_gateway]
    levels:
      basic: "A small catalogue and checkout"
      standard: "Categories, offers, order tracking and returns"
      advanced: "Large catalogue, many sellers or warehouses, loyalty"
  - key: crm
    label: Customer management (CRM)
    hint: Leads, contacts, follow-ups and sales pipeline.
    components: [crm_module]
    levels:
      basic: "Contacts and notes"
      standard: "Leads, follow-ups and a sales pipeline"
      advanced: "Teams, targets, campaigns and automation"
  - key: mobile_app
    hidden: true   # asked as its own question, not ticked
    sized_by_features: true   # sized by the stories of the features the app offers
    label: Mobile app (Android / iOS)
    hint: A phone app for customers or staff, in addition to the website.
    components: [custom_mobile_app]
    levels:
      basic: "A few screens that show the website's main features"
      standard: "The main features, with login and notifications"
      advanced: "Works offline, uses camera or location, many screens"
  - key: maps
    label: Maps and location
    hint: Show places on a map, find addresses, nearby search or track deliveries and staff.
    components: [maps_location]
    levels:
      basic: "Show places on a map"
      standard: "Address search and nearby search"
      advanced: "Live tracking, routes and map layers"
  - key: notifications
    label: SMS, email and app notifications
    hint: OTP login, reminders, booking confirmations and alerts by SMS, email or push.
    components: [notifications, integration_sms_email_gateway]
    counts_for_size: false
  - key: search
    label: Search
    hint: Find records, products or documents quickly with filters.
    components: [search_module]
  - key: marketplace
    label: Marketplace with many sellers
    hint: Sellers join, list products and get paid; the platform keeps a commission.
    components: [marketplace_multivendor]
    levels:
      basic: "Sellers sign up and list products; payouts done by hand"
      standard: "Seller dashboard, commission and automatic split payouts"
      advanced: "Seller KYC, ratings, disputes and listing approval at scale"
  - key: chat
    label: Chat between users or with support
    hint: People message each other or the support team inside the website or app.
    components: [in_app_chat]
    levels:
      basic: "Simple one-to-one messages"
      standard: "Chat history, unread counts, notifications and attachments"
      advanced: "A full messenger: groups, media, delivery receipts at scale"
  - key: offline_app
    label: Works without internet
    hint: The app keeps working offline and syncs when the connection returns.
    components: [mobile_offline_sync]
  - key: app_purchases
    label: In-app purchases or subscriptions
    hint: Users buy or subscribe through the App Store or Google Play.
    components: [mobile_in_app_purchases]
  - key: scanning
    label: Camera, QR code or barcode scanning
    hint: Take photos or scan codes inside the app.
    components: [mobile_camera_scanning]
  - key: ai_documents
    label: AI reads documents (OCR)
    hint: Pulls names, numbers and fields out of scanned forms, invoices or IDs.
    components: [ai_document_extraction]
  - key: ai_recommend
    label: Recommendations
    hint: Suggests products or content each user is likely to want.
    components: [ai_recommendations]
    levels:
      basic: "Simple rules (popular, recently viewed, bought together)"
      standard: "Personal suggestions from each user's activity"
      advanced: "A trained recommendation model with testing and tuning"
  - key: ai_voice
    label: Voice input or spoken answers
    hint: Users speak to the app or hear its answers (speech-to-text, text-to-speech).
    components: [ai_speech]
  - key: ai_text_sorting
    label: AI sorts messages or complaints
    hint: Puts text into categories or reads its sentiment automatically.
    components: [ai_text_classification]
  - key: ai_forecast
    label: Predictions and forecasts
    hint: Forecasts demand, risk or numbers from past data.
    components: [ai_forecasting]
  - key: ai_images
    label: AI recognises photos
    hint: Recognises or sorts images, e.g. product, damage or document type.
    components: [ai_image_recognition]
  - key: ai_agent
    label: AI agent that completes tasks
    hint: An AI assistant that carries out steps in the system for the user, with approval.
    components: [ai_agents]
  - key: ai_training
    label: Train our own AI model
    hint: Fine-tuning or training a model on your data, with a pipeline to retrain it.
    components: [mlops_pipeline]
  - key: old_data
    hidden: true   # asked as its own question, not ticked
    label: Move data from the old system
    hint: Bring existing records into the new software.
    components: [data_migration]
    levels:
      basic: "One clean spreadsheet or table"
      standard: "A few tables that need cleaning"
      advanced: "Years of records from several old systems"

# How big the software is follows from what is built: each feature adds points by its level,
# and the total sets the project size. The project size picks the standard building blocks
# every project needs (and their size), the default training and launch support, and the
# back-tested size factor of the parameter set (sets before v14). Since catalog v5 the S / M / L
# effort of each block already is its basic / standard / advanced version, so every level is
# priced at medium complexity (no second multiplier). Thresholds are placeholders, checked against
# the benchmark projects by `python -m app.cli backtest`.
sizing:
  source: placeholder
  default_level: standard
  levels:
    basic: {label: Basic, hint: "The simple version: few screens and rules", component_size: S, complexity: medium, points: 1}
    standard: {label: Standard, hint: "The usual version most projects need", component_size: M, complexity: medium, points: 2}
    advanced: {label: Advanced, hint: "A large, detailed version: many screens, rules, roles or records", component_size: L, complexity: medium, points: 4}
  custom_size_level: {S: basic, M: standard, L: advanced}
  # A feature found in a document is sized by its user stories (one per distinct thing a user
  # can do, as the document asks for it): 1-3 = basic, 4-8 = standard, 9+ = advanced. An extra
  # feature's S / M / L follows the same count. A level picked by hand still wins.
  stories:
    source: "placeholder, reasoned: the catalog sizes S = a few screens, M = a full module with workflow, L = a large sub-system; about 1-3, 4-8 and 9+ user stories (2026-10-22); calibrate on recorded projects"
    basic_max: 3
    standard_max: 8
    # Round 3 (OPEN_QUESTIONS 152): one advanced block covers up to 15 stories; a feature with
    # more is several advanced modules (ceil(stories / 15)), so a large sub-system is measured
    # instead of capped at one block. 15 continues the doubling of 3 and 8 (placeholder).
    advanced_max: 15
  # The most modules one feature or extra feature can be (an ERP of 83 modules is one extra
  # feature of 83 standard modules). Placeholder: a limit against typing mistakes only.
  max_units: 100
  tiers:
    - max_points: 4
      project_size: small
      label: Small
      base_size: S
      base_components: [ui_ux_design, user_management_rbac, responsive_frontend, functional_testing_uat_support, devops_cicd_setup]
      answers: {training_sessions: 1, training_outstation_sessions: 0, hypercare_weeks: 1, non_prod_environments: 1}
    - max_points: 10
      project_size: small_medium
      label: Small to medium
      base_size: S
      base_components: [discovery_requirement_study, ui_ux_design, user_management_rbac, responsive_frontend, security_hardening, notifications, functional_testing_uat_support, documentation_manuals, devops_cicd_setup]
      answers: {training_sessions: 2, training_outstation_sessions: 0, hypercare_weeks: 2, non_prod_environments: 1}
    - max_points: 20
      project_size: medium
      label: Medium
      base_size: M
      base_components: [discovery_requirement_study, solution_architecture, ui_ux_design, user_management_rbac, responsive_frontend, audit_trail_logging, security_hardening, notifications, functional_testing_uat_support, documentation_manuals, devops_cicd_setup]
      answers: {training_sessions: 2, hypercare_weeks: 2}
    - max_points: 36
      project_size: medium_large
      label: Medium to large
      base_size: M
      base_components: [discovery_requirement_study, solution_architecture, ui_ux_design, user_management_rbac, responsive_frontend, audit_trail_logging, security_hardening, notifications, integration_sms_email_gateway, functional_testing_uat_support, documentation_manuals, devops_cicd_setup]
      answers: {training_sessions: 4, hypercare_weeks: 4}
    - max_points: null
      project_size: large
      label: Large
      base_size: L
      base_components: [discovery_requirement_study, solution_architecture, ui_ux_design, user_management_rbac, responsive_frontend, audit_trail_logging, security_hardening, notifications, integration_sms_email_gateway, functional_testing_uat_support, documentation_manuals, devops_cicd_setup]
      answers: {training_sessions: 4, hypercare_weeks: 4}

# The questions. `group: main` = one per screen, in this order (three: version, platforms, scale; with the
# features and the deadline about eight screens); `detail` = the optional "a few more details" screen (skipped = the usual answer);
# `document` = not asked on the form, but read from an uploaded document; `hidden` = never asked
# nor read (set by the back-test). Options marked `unsure: true` are
# "Not sure": they price the usual answer and widen the range (see `not_sure`).
questions:
  version:
    label: Do you want a first simple version, or the full product?
    default: full
    on_upload: document   # a requirement document sets the scope; its user stories set the sizes
    options:
      - {value: mvp, label: A first simple version (MVP), hint: "Only the main features, kept simple, to launch quickly and learn", feature_level: basic, answers: {}}
      - {value: full, label: The full product, hint: "Everything done properly, ready for many users", feature_level: standard, answers: {}}
      - {value: not_sure, label: Not sure, hint: "We price the full product and show a wider range", feature_level: standard, unsure: true, answers: {}}
  platforms:
    label: Where should people use it?
    default: web
    on_upload: document   # an app is priced when the document asks for one
    options:
      - {value: web, label: Website, hint: "Works in the browser on phones and computers", answers: {}}
      - {value: web_mobile, label: Website and app, hint: "A website and an app for Android and iPhone", add_features: {mobile_app: null}, answers: {}}
      - {value: app, label: Mobile app only, hint: "An app for Android and iPhone, with a simple web admin panel to manage it", add_features: {mobile_app: null}, answers: {}}
      - {value: not_sure, label: Not sure, hint: "We price a website and show a wider range; the price of adding an app is shown with the estimate", unsure: true, answers: {}}
  scale:
    label: How many people will use it?
    default: up_to_10k
    answered_by_number: users_total   # a stated user count picks the option
    detail: "{users_total:,} users, {peak_concurrent_users:,} at the same time"
    options:
      - {value: up_to_100, max_users: 100, label: Up to 100, hint: "A team or a small office", answers: {users_total: 100, peak_concurrent_users: 10, documents_per_month: 50, chatbot_queries_per_day: 20}}
      - {value: up_to_1k, max_users: 1000, label: "100 – 1,000", hint: "A company or a few branches", answers: {users_total: 1000, peak_concurrent_users: 50, documents_per_month: 200, chatbot_queries_per_day: 100}}
      - {value: up_to_10k, max_users: 10000, label: "1,000 – 10,000", hint: "A city-level service or a growing app", answers: {users_total: 10000, peak_concurrent_users: 200, documents_per_month: 1000, chatbot_queries_per_day: 500}}
      - {value: up_to_1l, max_users: 100000, label: "10,000 – 1 lakh", hint: "A popular app or a state department", answers: {users_total: 100000, peak_concurrent_users: 1000, documents_per_month: 5000, chatbot_queries_per_day: 5000}, extra_components: [performance_load_testing]}
      - {value: up_to_10l, max_users: 1000000, label: "1 lakh – 10 lakh", hint: "A large app or a state-wide service", answers: {users_total: 1000000, peak_concurrent_users: 5000, documents_per_month: 30000, chatbot_queries_per_day: 20000}, extra_components: [performance_load_testing]}
      - {value: over_10l, max_users: null, label: "More than 10 lakh", hint: "National level", answers: {users_total: 5000000, peak_concurrent_users: 10000, documents_per_month: 100000, chatbot_queries_per_day: 50000}, extra_components: [performance_load_testing]}
      - {value: not_sure, label: Not sure, hint: "We assume 1,000 – 10,000 and show a wider range", unsure: true, answers: {users_total: 10000, peak_concurrent_users: 200, documents_per_month: 1000, chatbot_queries_per_day: 500}}
  integrations:
    label: Does it need to connect to other software you already use?
    group: detail  # optional: skipped = the usual answer, which is priced
    default: none
    options:
      - {value: none, label: "No", hint: "It works on its own", answers: {}}
      - {value: one_two, label: "Yes, one or two", hint: "e.g. accounting software (Tally, SAP) or an existing app", add_features: {connect_existing: standard}, answers: {}}
      - {value: many, label: "Yes, several", hint: "Many systems, kept in sync", add_features: {connect_existing: advanced}, answers: {}}
      # v3 (OPEN_QUESTIONS 147): "Not sure" leaves the connections out of the price and quotes
      # them as an option; until then it priced one or two (connect_existing standard)
      - {value: not_sure, label: Not sure, hint: "Not in the price: quoted separately, in case it is needed", left_out: {connect_existing: standard}, unsure: true, answers: {}}
  old_data:
    label: Do you need to bring in data from an old system?
    group: detail  # optional: skipped = the usual answer, which is priced
    default: "no"
    options:
      - {value: "no", label: "No", hint: "Starting fresh", answers: {}}
      - {value: little, label: "Yes, a little", hint: "One or two spreadsheets", add_features: {old_data: basic}, answers: {}}
      - {value: lot, label: "Yes, a lot", hint: "Years of records from old software", add_features: {old_data: advanced}, answers: {}}
      # v3 (OPEN_QUESTIONS 147): "Not sure" leaves the data move out of the price and quotes it
      # as an option; until then it priced a few tables (old_data standard)
      - {value: not_sure, label: Not sure, hint: "Not in the price: quoted separately, in case it is needed", left_out: {old_data: standard}, unsure: true, answers: {}}
  build_type:
    # asked on the form and after an upload (unless the document says): what the build reuses
    # changes the price a lot (parameter sets v19+: reuse)
    label: How will it be built?
    default: custom
    options:
      - {value: custom, label: Built from scratch, hint: "Custom code on the usual tools (e.g. React, Java, .NET): every screen written for you", answers: {build_type: custom}}
      - {value: framework, label: On a framework with ready admin screens, hint: "e.g. Django admin, Laravel Nova, Rails, a low-code tool: forms, lists and logins are mostly generated", answers: {build_type: framework}}
      - {value: cms, label: On a CMS with custom parts added, hint: "e.g. Drupal or WordPress with your own modules: common for government portals", answers: {build_type: cms}}
      - {value: ready_product, label: Set up a ready-made product, hint: "An existing product configured, not built: a SaaS service, Shopify, a WordPress theme as it is, a chatbot platform", answers: {build_type: ready_product}}
      - {value: not_sure, label: Not sure, hint: "We price building from scratch and show a wider range", unsure: true, answers: {build_type: custom}}
  hosting:
    label: Where will it run?
    group: detail  # optional: skipped = the usual answer, which is priced
    default: aws
    options:
      - {value: aws, label: "Public cloud (Amazon, Microsoft or Google)", hint: "Rented servers in an Indian data centre; the monthly cloud bill is part of the cost", answers: {hosting_provider: aws, hosting_in_scope: true}}
      - {value: indian_cloud, label: Government-approved Indian cloud, hint: "A MeitY-empanelled cloud (e.g. for government data); the monthly bill is part of the cost", answers: {hosting_provider: indian_cloud, hosting_in_scope: true}}
      - {value: on_prem, label: Own server room, hint: "Servers are bought and set up in your own building", answers: {hosting_provider: on_prem, hosting_in_scope: true}}
      - {value: existing, label: Servers you already have, hint: "e.g. NIC, a State Data Centre or your own cloud account: no new server cost (an estimate is shown separately)", answers: {hosting_provider: aws, hosting_in_scope: false}}
      - {value: not_sure, label: Not sure, hint: "We price a public cloud and show a wider range", unsure: true, answers: {hosting_provider: aws, hosting_in_scope: true}}
  support_years:
    label: For how many years should it be looked after once it is live?
    group: detail  # optional: skipped = the usual answer, which is priced
    # no term is assumed: a yearly price is quoted until a term is chosen (outside review,
    # OPEN_QUESTIONS 139); the price then includes one year of support
    default: per_year
    options:
      - {value: per_year, label: "Not decided: show a yearly price", hint: "The price includes one year of support; each further year costs about the same", answers: {om_years: 1}}
      - {value: 0, label: "Not needed", hint: "Handed over after launch; you run and maintain it", answers: {om_years: 0}}
      - {value: 1, label: 1 year, answers: {om_years: 1}}
      - {value: 2, label: 2 years, answers: {om_years: 2}}
      - {value: 3, label: 3 years, answers: {om_years: 3}}
      - {value: 5, label: 5 years, answers: {om_years: 5}}
  helpdesk_scope:
    label: Do you need a helpdesk team to answer users?
    group: document   # not asked on the form; read from an uploaded document, else the usual answer
    default: "no"
    hide_when: {support_years: [0]}
    options:
      - {value: "no", label: "No", hint: "The maintenance team handles support requests", answers: {helpdesk_in_scope: false}}
      - {value: "yes", label: "Yes", hint: "A separate helpdesk team answers users", answers: {helpdesk_in_scope: true}}
  support_hours:
    label: When should the helpdesk be available?
    group: document   # not asked on the form; read from an uploaded document, else the usual answer
    default: office
    hide_when: {helpdesk_scope: ["no"], support_years: [0]}
    options:
      - {value: office, label: Office hours, hint: "8 hours a day, 5 days a week", answers: {support_sla: 8x5}}
      - {value: always, label: Round the clock, hint: "24 hours, 7 days", answers: {support_sla: 24x7}}
  # --- optional details --------------------------------------------------------------------
  availability:
    label: If it stops working for an hour, how bad is that?
    group: document   # not asked on the form; read from an uploaded document, else the usual answer
    default: normal
    options:
      - {value: basic, label: Not a problem, hint: "Short breaks are fine (one server)", answers: {uptime_sla: "99.0"}}
      - {value: normal, label: Some trouble, hint: "It should rarely stop (99.5% of the time up)", answers: {uptime_sla: "99.5"}}
      - {value: high, label: Work stops, hint: "Almost never down (99.9%)", answers: {uptime_sla: "99.9"}}
      - {value: critical, label: It must never stop, hint: "Two of everything, up 99.95% of the time or more", answers: {uptime_sla: "99.95"}}
  disaster_site:
    label: Does it need a backup site for disasters?
    group: document   # not asked on the form; read from an uploaded document, else the usual answer
    default: "no"
    options:
      - {value: "no", label: "No", hint: "Backups are enough", answers: {disaster_recovery: false}}
      - {value: "yes", label: "Yes", hint: "A standby copy in another place, ready to take over (disaster recovery)", answers: {disaster_recovery: true}}
  penalties:
    # a reserve for penalties is priced only when the contract has them, cited from the document
    # (parameter sets v19+); an older reading's "not priced: penalties" quotes count too
    label: Does the contract have penalties for late delivery or downtime?
    group: detail
    on_upload: document
    default: "no"
    from_not_priced: penalties
    options:
      - {value: "no", label: "No", hint: "No penalty clause", answers: {penalty_clause: false}}
      - {value: "yes", label: "Yes", hint: "Liquidated damages or service-level penalties: a small reserve is priced", answers: {penalty_clause: true}}
      - {value: not_sure, label: Not sure, hint: "We price no penalty clause and show a wider range", unsure: true, answers: {penalty_clause: false}}
  web_domain:
    # free from NIC only for a .gov.in / .nic.in address the document names (v19+)
    label: What web address will it use?
    group: document
    default: commercial
    options:
      - {value: commercial, label: "A .in or .com address", hint: "Bought from a registrar every year", answers: {web_domain: commercial}}
      - {value: gov_in, label: "A .gov.in or .nic.in address", hint: "Free from NIC for government bodies", answers: {web_domain: gov_in}}
      - {value: client, label: "The client provides it", hint: "The document says the client gives the address (no cost in the price)", answers: {domain_in_scope: false}}
  ssl_certificate:
    # v20 parameter sets: a free certificate unless the document asks for OV; nothing to pay when
    # the client provides it. Most documents never mention it, which is not a gap.
    label: Which SSL certificate does it need?
    group: document
    default: free
    silent_means_usual: true
    options:
      - {value: free, label: "A free certificate (Let's Encrypt)", hint: "Domain-validated, renewed automatically", answers: {ssl_type: dv_free}}
      - {value: ov, label: "An organisation-validated (OV or EV) certificate", hint: "When the document asks for OV or EV", answers: {ssl_type: ov}}
      - {value: client, label: "The client provides it", hint: "The document says the client gives the certificate (no cost in the price)", answers: {ssl_in_scope: false}}
  security_audit:
    label: Do you need an independent security check before launch?
    group: document   # not asked on the form; read from an uploaded document, else the usual answer
    default: "no"
    options:
      - {value: "no", label: "No", hint: "The team's own security testing only", answers: {cert_in_audit: false}}
      - {value: "yes", label: "Yes", hint: "A certified outside auditor (CERT-In empanelled) tests it before launch and once a year, and the team fixes what it finds; usual for government sites and apps with payments or personal data", answers: {cert_in_audit: true}, extra_components: [vapt_remediation]}
  reporting:
    label: Do you want monthly progress reports and review meetings?
    group: document   # not asked on the form; read from an uploaded document, else the usual answer
    default: "no"
    options:
      - {value: "no", label: "No", hint: "Normal updates from the project manager", answers: {governance_overheads: false}}
      - {value: "yes", label: "Yes", hint: "Written monthly reports, review meetings and visits; usual for government and large companies", answers: {governance_overheads: true}}
  design:
    label: Do you already have a design for the screens?
    group: detail  # optional: skipped = the usual answer, which is priced
    default: some
    options:
      - {value: ready, label: "Yes, the design is ready", hint: "Screens already designed (e.g. in Figma), or a brand guide to follow closely", component_complexity: {ui_ux_design: low}, answers: {}}
      - {value: some, label: "A little (logo and colours)", hint: "The team designs the screens", answers: {}}
      - {value: custom, label: "No, we want a special design", hint: "A unique look with custom illustrations and animations", component_complexity: {ui_ux_design: high}, answers: {}}
      - {value: not_sure, label: Not sure, hint: "We price the team designing the screens and show a wider range", unsure: true, answers: {}}
  chatbot_task:
    label: What should the chatbot handle?
    group: detail
    default: simple
    only_with_features: [ai_chatbot]
    only_with_custom_types: [ai]
    options:
      - {value: simple, label: Common questions, hint: "FAQs and information from your documents (a smaller, cheaper AI model)", answers: {ai_model_tier: simple}}
      - {value: advanced, label: Complex questions, hint: "Reasoning over many documents and multi-step help (a larger AI model, costs more per question)", answers: {ai_model_tier: advanced}}
      - {value: not_sure, label: Not sure, hint: "We price common questions and show a wider range", unsure: true, answers: {ai_model_tier: simple}}
  chatbot_volume:
    label: About how many questions will the chatbot answer each day?
    group: document   # not asked on the form; read from an uploaded document, else the usual answer
    default: by_users
    only_with_features: [ai_chatbot]
    only_with_custom_types: [ai]
    options:
      - {value: by_users, label: Guess from the number of users, hint: "We estimate it from how many people use it", answers: {}}
      - {value: "100", label: About 100, answers: {chatbot_queries_per_day: 100}}
      - {value: "1000", label: "About 1,000", answers: {chatbot_queries_per_day: 1000}}
      - {value: "10000", label: "About 10,000", answers: {chatbot_queries_per_day: 10000}}
  launch_help:
    label: How much help do your users need at launch?
    group: document   # not asked on the form; read from an uploaded document, else the usual answer
    default: usual
    options:
      - {value: none, label: None, hint: "Users learn it themselves; normal support starts at launch", answers: {training_sessions: 0, training_outstation_sessions: 0, hypercare_weeks: 0}}
      - {value: usual, label: The usual, hint: "Training sessions and a few weeks of extra support, by project size", answers: {}}
      - {value: extra, label: A lot, hint: "8 training sessions and 8 weeks of extra support, for many offices or user groups", answers: {training_sessions: 8, hypercare_weeks: 8}}
  onsite_period:
    label: How long are staff needed at the client's office?
    group: document   # not asked on the form; read from an uploaded document, else the usual answer
    default: support
    only_with_override: onsite_staff
    options:
      - {value: support, label: Throughout support, hint: "Every year of support after launch", answers: {}}
      - {value: event, label: Only during an event or the launch, hint: "A few days (onsite_event_days), priced once", answers: {}}
  # --- not asked ---------------------------------------------------------------------------
  # A sales decision, asked on every estimate (nothing pre-selected): the share of the AI saving
  # the price passes to the client; the rest is kept as margin (engine ai_passthrough_percent).
  # The default only serves requests that do not send it (API, back-test, older estimates
  # re-priced): all passed through, as before the question existed. OPEN_QUESTIONS 145.
  ai_passthrough:
    label: How much of the AI saving do you pass on to the client?
    default: all
    must_choose: true
    options:
      - {value: all, label: All of it, hint: "Lowest price. For competitive and government tenders, where the lowest bid wins", answers: {ai_passthrough_percent: 1}}
      - {value: most, label: Most of it (75%), hint: "Still a competitive price, with a little extra margin", answers: {ai_passthrough_percent: 0.75}}
      - {value: half, label: Half, hint: "Between the two", answers: {ai_passthrough_percent: 0.5}}
      - {value: keep, label: Keep it, hint: "For private or negotiated work: the price stays at the usual level and the saving is your margin", answers: {ai_passthrough_percent: 0}}

  ai_use:
    label: How much will the development team use AI tools (like Claude or Copilot)?
    group: hidden   # the company's own setting (Settings); the back-test sets it by award year
    default: medium
    options:
      - {value: none, label: Not at all, answers: {team_ai_maturity: none}}
      - {value: low, label: A little, answers: {team_ai_maturity: low}}
      - {value: medium, label: Regularly, answers: {team_ai_maturity: medium}}
      - {value: high, label: Heavily, answers: {team_ai_maturity: high}}

# "Not sure" answers price the usual answer but make the requirements less clear (1-5 scale),
# which widens the range and the risk buffer: clarity = max(min_clarity, requirement_clarity
# − ceil(not-sure answers / answers_per_step)).
not_sure:
  source: placeholder
  answers_per_step: 2
  min_clarity: 1
  # v19 (outside review): after an upload, what the document does not state and is priced at the
  # usual answer is open too, so it widens the range (raising the risk allowance), at most
  # assumed_max_steps steps (OPEN_QUESTIONS 139)
  assumed_per_step: 4
  assumed_max_steps: 1

# Ranking the open questions by price impact re-prices the form once per option. Fewer
# simulation runs keep it fast; a fixed seed keeps the ranking stable between requests.
impact:
  monte_carlo_runs: 500
  seed: 2026

# Countries the app prices for. Each has its own rate card and parameter set (region key),
# its currency, and the hosting options that make sense there.
countries:
  india: {label: India, currency: INR, hosting_options: [aws, indian_cloud, on_prem]}
  # The US is switched off for now (user's request, 2026-10-16): set enabled: true to bring it back.
  us: {label: United States, currency: USD, hosting_options: [aws, on_prem], enabled: false}

# Features the requirement document asks for that are not in the list above. The AI (or the
# user) gives each one a type and a size; the type picks a generic catalog component (catalog
# v2) and the size picks its S/M/L effort. Labels are what the user sees.
# What else a feature needs beyond its baseline (and sign-in, which every project has). Each
# item adds catalog building blocks at a level; their hours come from the catalog (with its
# sources), never from here. A block already in the project (a feature's, a standard block or
# another item's) is not added again: the larger level wins. Items not chosen are not priced;
# they do not change the project size (feature points). An item never makes a standard
# building block bigger (it may only ask for one at basic): a whole size step (e.g. user accounts
# S 76 h -> M 252 h) is a larger module, not the increment one item adds, and no source here
# prices such increments. `note` says what is and is not priced, in plain words.
scope_source: "Reasoned mapping of each item onto existing catalog blocks (catalog v6; v7 adds new blocks); placeholder until project hours are recorded"
scope:
  - key: sign_in
    label: Sign-in and user accounts
    feature: null   # every project: user accounts are a standard building block
    items:
      - key: otp_codes
        label: One-time codes by SMS or email (sign-in or password reset)
        adds: {integration_sms_email_gateway: basic}
        note: Priced as connecting an SMS / email service.
        keywords: [otp, one time password, one-time password]
      # roles and permissions are part of the user-accounts block at every size (its catalog
      # description), so they are not a separate item.
      - key: social_login
        label: Sign in with Google or Microsoft accounts
        adds: {integration_sso_identity: basic}
        note: Priced as a basic single sign-on connection.
        keywords: [social login, sign in with google, login with google, oauth]
      - key: two_step_sign_in
        label: Two-step sign-in (MFA)
        adds: {integration_sms_email_gateway: basic}
        note: Priced as connecting an SMS / email service for the codes. The extra sign-in step itself is part of the user-accounts block; no source here prices it separately.
        partly_priced: true
        keywords: [multi-factor, multi factor, two-factor, two factor, 2fa, mfa]
      - key: enterprise_sso
        label: Single sign-on with the organisation's own login (SAML / OIDC, Active Directory)
        adds: {integration_sso_identity: standard}   # ~127 h; the catalog's sources: 80-150 h
        note: Priced as a standard single sign-on connection.
        keywords: [single sign-on, single sign on, saml, active directory, ldap]
      - key: audit_log
        label: A record of who did what (audit log)
        adds: {audit_trail_logging: basic}
        keywords: [audit trail, audit log, audit logs]
      - key: privacy_rights
        label: "Privacy rights: consent, delete my account, download my data (DPDP Act)"
        adds: {privacy_consent_dpdp: basic}
        keywords: [right to erasure, account deletion, delete account, delete their account, download my data, download their data, data portability, consent management]
  - key: connections
    label: Connections with other systems
    feature: null
    items:
      - key: public_api
        label: An API or webhooks so other systems can use it
        adds: {custom_integration: basic}
        note: Priced as one basic connection to another system (the catalog's general integration block, reasoned); a large public API with many endpoints costs more.
        partly_priced: true
        keywords: [webhook, webhooks, public api, open api, apis for third-party, api for third-party, third-party api access]
      - key: data_import
        label: Regular data import or sync from another system
        adds: {custom_integration: basic}
        note: Priced as one basic connection of its own (the catalog's general integration block, reasoned), separate from any other system connected.
        keywords: [data import, scheduled import, etl, data sync, data synchronisation, data synchronization]
  - key: payments_scope
    label: Payments
    feature: payments
    items:
      - key: subscriptions
        label: Subscriptions and recurring billing
        adds: {billing_invoicing: basic}
        note: Priced as a basic billing block (plans, repeat charges and invoices).
        keywords: [subscription, subscriptions, recurring payment, recurring payments, recurring billing, auto-debit, autopay, e-mandate]
  - key: notifications_scope
    label: Notifications
    feature: notifications
    items:
      - key: whatsapp
        label: Messages on WhatsApp
        adds: {integration_sms_email_gateway: basic}
        note: Priced as connecting a messaging service (the same block as SMS and email).
        keywords: [whatsapp]
      - key: push
        label: Push notifications on phones and browsers
        adds: {push_notifications: basic}
        keywords: [push notification, push notifications, fcm, firebase cloud messaging, apns]
  - key: forms_scope
    label: Online forms
    feature: online_forms
    items:
      - key: forms_ekyc
        label: Check the applicant's identity with Aadhaar e-KYC
        adds: {integration_aadhaar_ekyc: basic}
        keywords: [e-kyc, ekyc, aadhaar authentication]
      - key: forms_digilocker
        label: Fetch certificates from DigiLocker
        adds: {integration_digilocker: basic}
        keywords: [digilocker]
      - key: forms_fee
        label: Collect an application fee online
        adds: {integration_payment_gateway: basic}
        keywords: [application fee, processing fee, registration fee]
  - key: workflow_scope
    label: Approvals
    feature: approval_workflow
    items:
      - key: workflow_audit
        label: Record every decision and who made it (audit trail)
        adds: {audit_trail_logging: basic}
        keywords: [audit trail, audit log]
      - key: workflow_reports
        label: Reports on pending files and delays
        adds: {dashboard_mis_reports: basic}
        keywords: [pendency, mis report, mis reports]
      - key: workflow_alerts
        label: SMS or email alerts at each step
        adds: {notifications: basic, integration_sms_email_gateway: basic}
        keywords: [sms alert, sms alerts, email alert, email alerts]
  - key: documents_scope
    label: Documents
    feature: documents
    items:
      - key: documents_audit
        label: Record who opened or changed each file
        adds: {audit_trail_logging: basic}
        keywords: [audit trail, audit log]
      - key: documents_esign
        label: Digital signatures (eSign or DSC)
        adds: {custom_integration: basic}
        note: Priced as one basic connection to a signing service (the catalog's general integration block, reasoned).
        partly_priced: true
        keywords: [esign, e-sign, digital signature, digital signatures, dsc]
  - key: chatbot_scope
    label: AI chatbot
    feature: ai_chatbot
    items:
      - key: chatbot_indian_languages
        label: Answers in Indian languages (Bhashini translation)
        adds: {integration_bhashini_translation: basic}
        keywords: [bhashini, indian languages, regional languages]
      - key: chatbot_records
        label: Looks up the user's own records in your systems
        adds: {integration_erp_legacy: basic}
        keywords: [application status, status of application]
  - key: bookings_scope
    label: Bookings
    feature: bookings
    items:
      - key: booking_payment
        label: Pay online when booking
        adds: {integration_payment_gateway: basic}
        keywords: [advance payment, booking fee, pay online]
      - key: booking_reminders
        label: Reminders by SMS or email
        adds: {notifications: basic, integration_sms_email_gateway: basic}
        keywords: [reminder, reminders]
      - key: booking_nearby
        label: Find the nearest centre on a map
        adds: {maps_location: basic}
        keywords: [nearest centre, nearest center, nearby]
  - key: store_scope
    label: Online store
    feature: online_store
    items:
      - key: store_stock
        label: Stock tracking
        adds: {inventory_management: basic}
        keywords: [stock, inventory]
      - key: store_invoices
        label: GST invoices
        adds: {billing_invoicing: basic}
        keywords: [gst invoice, tax invoice, invoices]
      - key: store_reviews
        label: Ratings and reviews
        adds: {reviews_ratings: basic}
        keywords: [ratings and reviews, product reviews, customer reviews, star rating, star ratings]
      - key: store_coupons
        label: Coupons and discounts
        adds: {coupons_promotions: basic}
        keywords: [coupon, coupons, promo code, promo codes, discount code, discount codes]
      - key: store_shipping
        label: Courier connection (rates, labels, tracking)
        adds: {shipping_integration: basic}
        keywords: [shipping, courier, shiprocket, delhivery, shipment tracking, shipping labels]
      - key: store_returns
        label: Returns and refunds
        adds: {returns_refunds: basic}
        keywords: [refund, refunds, returns and refunds, return request, return requests]
      - key: store_loyalty
        label: Loyalty points
        adds: {loyalty_rewards: basic}
        keywords: [loyalty points, reward points, loyalty programme, loyalty program]
  - key: website_scope
    label: Public website
    feature: public_website
    items:
      - key: seo
        label: Search engine set-up (SEO)
        adds: {seo_setup: basic}
        keywords: [seo, search engine optimisation, search engine optimization, sitemap, meta tags]
  - key: security_scope
    label: Security, compliance and monitoring
    feature: null
    items:
      - key: monitoring
        label: Monitoring, logs and alerts
        adds: {monitoring_observability: basic}
        keywords: [application monitoring, uptime monitoring, monitoring and alerting, observability]
      - key: siem
        label: Security monitoring (SIEM)
        adds: {security_monitoring_siem: basic}
        keywords: [siem, security monitoring, security operations centre, security operations center]
      - key: security_scans
        label: Automatic security scans of the code
        adds: {security_scanning_ci: basic}
        keywords: [sast, dast, dependency scanning, static code analysis]
      - key: data_masking
        label: Masking personal data
        adds: {pii_masking: basic}
        keywords: [data masking, masking of personal data, tokenisation, tokenization]
      - key: secrets
        label: Keys and secrets kept in a vault (KMS)
        adds: {secrets_management: basic}
        keywords: [key management, kms, hashicorp vault, secrets management, hsm]
      - key: compliance
        label: Compliance controls (ISO 27001, SOC 2)
        adds: {compliance_controls: basic}
        keywords: [soc 2, soc2, compliance controls]

custom_feature_types:
  module: {label: "Screens / module", component: custom_module}
  integration: {label: "Connection to another system", component: custom_integration}
  report: {label: "Reports / dashboard", component: custom_report}
  ai: {label: "AI feature", component: custom_ai_feature}
  mobile: {label: "Mobile app", component: custom_mobile_app}
max_custom_features: 50

# Working hours in one person-day, to show the work (and enter rates) in hours. An 8-hour
# working day (Factories Act / Shops and Establishments norm); the engine itself counts days.
hours_per_person_day: 8

# "Does this price look real?" (services/quick/reality.py, shown at the top of the results). Each
# check compares parts of the finished estimate with each other, never with market prices, and
# never changes the price. The optional AI second opinion reads the features, levels and the
# hours per feature and names concerns (wrong level, missing or unneeded feature); it gives no
# numbers. Thresholds are reasoned placeholders.
reality_check:
  source: "placeholder, reasoned: set-up work (design, login, testing, deployment) above 60% of the building means the features are a small part of the price; one feature above half of the feature work in a list of 3 or more usually means a level set too high; a year of running above the whole build is unusual for a portal; over 15 people on average is a large programme; researched blocks are low confidence (OPEN_QUESTIONS 125, 126)"
  setup_share_max: 0.6
  feature_share_max: 0.5
  feature_share_min_features: 3
  run_per_year_max_of_build: 1.0
  max_average_team: 15
  researched_share_max: 0.3
  not_sure_max: 3
  second_opinion_prompt: second_opinion_v1
  second_opinion_max_flags: 6
  # EMD check (fix 2026-10-22): GFR 2017 Rule 170(i) sets bid security at 2-5% of the
  # estimated value (https://doe.gov.in/files/circulars_document/FInal_GFR_upto_31_07_2024.pdf);
  # a price (without GST) outside that band is flagged
  emd_share_min: 0.02
  emd_share_max: 0.05
  emd_band_factor: 1   # any price outside the EMD range is flagged (the review of the PBD estimate, OPEN_QUESTIONS 135)

# Independent check (OPEN_QUESTIONS 140): a second estimate from what the system must contain,
# counted from the document itself (never from our feature list, which follows how much the
# document says), compared with the build effort before the price is shared. The AI only lists
# named items with quotes (prompts/count_system_v1.md); the code counts them and does the sums:
#   anchor_pd = (entities × pd_per_entity + Σ screens × screen_weight × pd_per_screen
#                + roles × pd_per_role + selected integrations × pd_per_integration
#                + hard problems × pd_per_hard_problem + tenancy_pd) × wrapper
#                × quality × ai_fit × clarity
# A ratio of our build effort to the anchor outside [ratio_low, ratio_high], or a price more
# than emd_block_factor outside the EMD range, needs a person to confirm before export.
# Every figure is a prior from an outside review of the PBD and clinic estimates (2026-10-22),
# not measured: calibrate on finished projects (outcomes).
independent_check:
  source: placeholder
  prompt: count_system_v1
  pd_per_entity: 6
  pd_per_screen: 3
  pd_per_role: 2
  pd_per_integration: 8          # only integrations whose provider the document names
  pd_per_hard_problem: 12
  screen_weight: {single: 1, list_detail_edit: 1.5}
  tenancy_pd: {single: 0, multi_tenant: 6, multi_region: 15}
  wrapper: 1.35                  # testing, documents and deployment around the engineering
  quality: {internal_tool: 1.0, commercial: 1.15, regulated_or_govt: 1.35}
  ai_fit: {greenfield_standard_stack: 0.88, greenfield_novel_domain: 0.95, brownfield_familiar: 1.0, large_legacy_codebase: 1.05}
  clarity: {clear: 1.0, vague: 1.1, contradictory: 1.2}
  ratio_low: 0.67
  ratio_high: 1.5
  emd_block_factor: 2
  # our project sizes as the bands' three sizes
  size_tier: {small: small, small_medium: small, medium: medium, medium_large: large, large: large}
  system_classes:
    content_site: "Content website (pages, news, documents)"
    crud_workflow: "Forms and approval workflow"
    booking_scheduling: "Booking and scheduling"
    marketplace: "Marketplace (buyers and sellers)"
    data_platform: "Data platform (reports, analytics)"
    ai_product: "AI product"
    integration_mw: "Integration middleware"
    realtime_system: "Real-time system (live tracking, chat, video)"
  # person-months for the whole build by kind of system and size: [low, high]
  bands:
    content_site:       {small: [2, 4],   medium: [5, 9],   large: [10, 18]}
    crud_workflow:      {small: [4, 7],   medium: [8, 15],  large: [16, 30]}
    booking_scheduling: {small: [6, 10],  medium: [11, 20], large: [21, 40]}
    marketplace:        {small: [10, 16], medium: [17, 30], large: [31, 60]}
    data_platform:      {small: [8, 14],  medium: [15, 28], large: [29, 55]}
    ai_product:         {small: [8, 15],  medium: [16, 30], large: [31, 60]}
    integration_mw:     {small: [5, 9],   medium: [10, 18], large: [19, 35]}
