# A sentence saying the client provides hosting, the web address or the SSL certificate answers
# that question, citing the sentence (services/extraction/client_provided.py). Checked in code on
# the stored page text of every document, with either reader, and on earlier readings too.
# Outside review of the PBD estimate (2026-10-23): "Domain and hosting will be provided to the
# agency from the department" was read, cited, and still priced as ₹5.7 lakh of hosting.
# Licences and devices are left out: quick estimates never price them.
client_provided:
  source: "Outside review of the PBD and clinic estimates (2026-10-23); phrase lists reasoned"
  give: [will be provided, shall be provided, would be provided, to be provided, will provide, shall provide, provided by, provided from, will be made available, shall be made available, infrastructure provided by, provisioned by, be hosted on, hosted on, hosted in]
  by_client: [department, client, ministry, purchaser, employer]
  by_vendor: [by the agency, by the bidder, by the vendor, by the selected agency, by the successful bidder, by the contractor, by the system integrator, by the service provider, agency shall, agency will, bidder shall, bidder will, vendor shall, vendor will, contractor shall, contractor will]
  max_sentence_chars: 400
  items:
    - {words: [hosting, hosted, server, servers, server space, cloud, cloud space, data centre, data center, infrastructure], question: hosting, value: existing}
    - {words: [domain, domain name, web address, url], question: web_domain, value: client}
    - {words: [ssl, ssl certificate, tls certificate], question: ssl_certificate, value: client}
  # The client by its own name (RailTel tender, OPEN_QUESTIONS 157): "The application shall be
  # hosted on RailTel's cloud in DC-DR mode which shall be provisioned by RailTel."
  own_words: [cloud, data centre, data center, data centres, data centers, servers, server, infrastructure, premises]
  by_name: [provisioned by, hosted by, arranged by]
  not_client: [bidder, bidders, vendor, agency, contractor, service provider, system integrator, msp, csp, aws, amazon, azure, microsoft, google, gcp, oracle, ibm, meity]

# Counts a document states for what is built (services/extraction/stated_counts.py,
# OPEN_QUESTIONS 194): "200 services" (a table cell) or "API based integration with 20 State
# Systems" make that feature ceil(count / per_unit) modules at `level`, citing the line; the
# largest count stated wins, at most sizing.max_units. Strict on purpose: a count at the start
# of a longer line is a table's item number, a count after a dot is a section number, and only
# the listed words may stand between the number and the noun. The person checks every count on
# the review form. per_unit follows the form's own level words: a standard "forms" module is
# "several forms" (about 5), a standard connection is "one or two" systems (2).
stated_counts:
  source: "placeholder, reasoned 2026-11-02 (OPEN_QUESTIONS 194): per_unit from the level words of the form (several = about 5; one or two = 2); phrase lists from the 8 production-path tenders' text"
  max_count: 2000
  max_line_words_at_start: 3
  rules:
    - feature: online_forms
      nouns: [services, e-services, forms]
      adjectives: [more, citizen, online, public, government, application, service]
      per_unit: 5
      level: standard
    - feature: connect_existing
      after: [integration with, integrations with, integrate with, integrated with, interface with, interfaces with, interfacing with, connect with, connected with, connectivity with]
      nouns: [systems, applications, apis, portals, databases]
      adjectives: [state, national, national/private, external, existing, departmental, third-party, third party, government, other, private, legacy, central]
      per_unit: 2
      level: standard

# What the review and results pages say about the project (OPEN_QUESTIONS 205): the industry
# (read by the AI, shown only), the project type (the project type above sharing most features
# with the ticked ones) and the user roles (from the user stories). None of it is priced.
# A prerequisite rule warns when a feature usually needs another whose building blocks it does
# not bring; it never adds anything. An add-on the document asks for whose feature is not
# ticked is warned about too (no rule needed: each add-on names its feature).
project_context:
  source: "reasoned 2026-11-02 (OPEN_QUESTIONS 205) from each feature's building blocks: the needed feature's blocks are not among the asking feature's"
  max_roles: 8
  other_type: Custom software
  mobile_app_note: with a mobile app
  prerequisites:
    - feature: marketplace
      needs_any: [payments, online_store]
      why: "Sellers on a marketplace are usually paid through it, but neither online payment nor an online store is ticked."
    # a browser-only build the document or user chose (platforms: web) can work offline and
    # scan with the camera in the browser: no warning then (OPEN_QUESTIONS 206)
    - feature: offline_app
      needs_any: [mobile_app]
      why: "Working without internet is part of a mobile app, but the mobile app is not ticked."
      not_when_answered: {platforms: [web]}
    - feature: app_purchases
      needs_any: [mobile_app]
      why: "In-app purchases are sold inside a mobile app, but the mobile app is not ticked."
    - feature: scanning
      needs_any: [mobile_app]
      why: "Camera and QR scanning is built into a mobile app, but the mobile app is not ticked."
      not_when_answered: {platforms: [web]}

# Every requirement sentence accounted for (OPEN_QUESTIONS 204): a sentence that asks for
# something ("shall", "must", ...) and is quoted by no finding of the reading is listed on the
# review screen as "not priced yet", so a requirement the reader skipped is never lost silently.
coverage:
  source: "placeholder, reasoned 2026-11-02 (OPEN_QUESTIONS 204): requirement words of SRS / RFP writing; skip words for the bidder's duties and bid terms; shared words so a quote of part of a sentence covers it"
  modal_words: [shall, must, should, will be able to, is required to, are required to, should be able to]
  skip_words: [bidder, bidders, tenderer, tenderers, contractor, vendor, consultant, supplier, service provider, system integrator, selected agency, successful agency, emd, earnest money, bank guarantee, performance security, bid security, penalty, liquidated damages, payment shall, invoice shall be raised, tender, bid shall, proposal shall, the agency shall, the firm shall, the company shall, jurisdiction, arbitration, force majeure, termination,
    # OPEN_QUESTIONS 219: contract, legal, bid evaluation and tax wording (RailTel RFP: 233 listed,
    # mostly its general conditions); phrases only contract terms use, so a school's marks, a
    # lender's scoring or a legal firm's courts are still listed
    liability, liable, representation or warranty, warranty shall, surety, indemnity, indemnify, arbitral, arbitrator, arbitrators, the purchaser, this contract, the contract shall, breach of contract, this agreement, integrity pact, joint venture, power of attorney, liquidator, debenture, corruption, forfeiture, forfeited, consequential damages, final and binding, notwithstanding, hereunder, hereinbefore, hereinafter, thereof, prior written consent,
    eligibility criteria, blacklisted, blacklisting, similar work, annual turnover, scoring shall be, evaluation committee, technical evaluation, financial evaluation, evaluation of bids, evaluation of tenders, qcbs, awarded the work, award of work, award of contract, letter of acceptance, purchase order, sub po, po value, value of po, annexure, scanned copies, submitted online, be submitted along, bid should, clarification requests, unit rate, unit of rates, unit price shall prevail, rates quoted, sor, applicable taxes, applicable gst, date of invoicing, statutory requirement, tds,
    bank guarantee, insolvent, insolvency, vigilance, beneficial owner, addendum, corrigendum, e-nivida, signed and stamped, in the offer, our offer, summarily rejected,
    shall mean, the said, this guarantee, the guarantee, this bond, the bond, surety insurer, dispute resolution, monitor shall, discharged from, masculine gender, registration committee, the authority shall, conclusive, invocation, issuing branch, executant]
  min_sentence_words: 5
  shared_words: 6
  max_listed: 40
  # OPEN_QUESTIONS 219, reasoned (placeholder): a page whose modal sentences are mostly contract or bid
  # terms (general conditions, guarantee formats) is a terms page and lists nothing
  terms_page_share: 0.5
  terms_page_min_sentences: 4
  # OPEN_QUESTIONS 220: a sentence about the vendor's duties ("The vendor shall provide...", in
  # tenders also "The Bidder shall provide...", RailTel p30) describes the work; when deciding
  # whether a feature was found only on pages of terms, these words alone never make a page one
  terms_page_ignore: [bidder, bidders, tenderer, tenderers, contractor, vendor, consultant, supplier, service provider, system integrator, selected agency, successful agency, the agency shall, the firm shall, the company shall]
  # OPEN_QUESTIONS 210, reasoned: a typed description lists what it wants joined by these words
  # ("pay fees online and see their child's attendance"); a part this long that no finding
  # quotes is listed on the features screen as not matched yet
  description_split_words: [and, also, but, plus, as well as, with, along with, so that]
  description_min_words: 3
  description_generic_words: [a, an, the, our, own, my, your, their, we, i, for, of, to, in, at, "on", new, simple, system, systems, software, app, apps, application, website, web site, site, portal, platform, product, tool, solution, management, project]

