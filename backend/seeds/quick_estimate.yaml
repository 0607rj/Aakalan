  run.helpdesk: helpdesk staffing
  run.hosting: cloud hosting
  run.dr: the disaster-recovery site
  run.onsite_resources: staff placed at the client's office
  run.patching_bugfix: bug fixing and upgrades
  run.change_requests: changes asked for after launch
  build.integrations: connecting to other systems
  build.ai_ml: building the AI chatbot
  build.module_development: building the main screens and features
  build.data_migration: moving old data
  programme.project_management: project management
  run.third_party_services: usage of SMS, email, maps and other paid services
  build.tools: developer tool subscriptions
  build.content_translation: translating content into other languages

# Basic reader (used when no AI key is configured): words and phrases that mark a feature or a
# choice in a tender. Matched case-insensitively on whole words; every match is reported with
# its page, nearest clause number and the sentence it appears in.
# Client mode (a department or company planning its tender budget): bids below this share of
# the low end, or above this share of the high end, are flagged.
client_mode:
  source: placeholder
  too_low_share_of_low: 0.75
  too_high_share_of_high: 1.25
  note: "A bid far below the fair range usually means missed scope or a vendor who cannot deliver; ask for a written justification of the price before accepting it. A bid far above it is probably overpriced."

# "Similar real projects" shown with every estimate (from seeds/benchmarks): score = features
# shared (Jaccard) x weight + same size (or a neighbouring size) + same build type.
similar_projects:
  count: 5
  min_score: 0.35
  weight_features: 0.55
  weight_size: 0.3
  weight_neighbour_size: 0.12
  weight_build_type: 0.15

keywords:
  # Long documents name many features in passing (payment terms, "dashboard of bids"): from
  # this many pages a feature needs this many mentions to be ticked; fewer are only offered.
  long_document_pages: 20
  min_mentions_long_document: 3
  features:
    online_forms: [online application, online registration, registration form, application form, empanelment, online submission, e-application]
    approval_workflow: [workflow, approval process, multi-level approval, scrutiny, approving authority, file movement]
    documents: [document management, document upload, upload documents, upload of documents, dms, document repository]
    dashboards: [dashboard, dashboards, mis report, mis reports, analytics, reports module]
    ai_chatbot: [chatbot, chat bot, virtual assistant, conversational ai, generative ai, ai assistant]
    payments: [payment gateway, online payment, online payments, e-payment, fee payment, paygov, sbi epay, pay online, pay the fee online, pay fees online, pay the fees online, upi payment]
    aadhaar_digilocker: [aadhaar, ekyc, e-kyc, digilocker]
    staff_login: [single sign-on, single sign on, sso, ldap, parichay, active directory]
    connect_existing: [sap, erp, legacy system, legacy systems, existing system, existing systems, third-party integration]
    languages: [bilingual, multilingual, regional language, regional languages, bhashini, hindi]
    accessibility: [gigw, wcag, accessibility, divyang]
    public_website: [public website, content management system, cms, notices and circulars, news and events]
    grievances: [grievance, grievances, complaint management, helpdesk ticket]
    old_data: [data migration, legacy data, historical data, migration of existing data, digitisation of records]
    inventory: [inventory, stock management, stock register, warehouse, stock in, stock out, barcode]
    billing: [billing, invoice, invoicing, invoices, receipts, tax invoice]
    bookings: [booking, bookings, appointment, appointments, scheduling, reservation, reservations]
    online_store: [online store, e-commerce, ecommerce, shopping cart, cart and checkout, product catalogue]
    crm: [crm, customer relationship, lead management, leads, sales pipeline]
    mobile_app: [mobile app, mobile application, android app, ios app, android, iphone app]
    notifications: [sms, push notification, push notifications, email alerts, sms alerts, otp, reminders by sms]
    maps: [maps, map view, gis, geo-tagging, geotagging, geolocation, location tracking, gps tracking, google maps, nearby search]
    search: [search functionality, advanced search, search facility, full-text search]
  choices:
    # A first version / pilot named in the document (strong phrases only: "phase 1" alone is
    # usually just the first stage of a full project).
    version:
      mvp: [minimum viable product, mvp, pilot project, pilot phase, pilot implementation, proof of concept]
    availability:
      critical: ["99.95%", "99.99%", disaster recovery, dr site]
      high: ["99.9%"]
      normal: ["99.5%"]
    hosting:
      indian_cloud: [meity empanelled, meity-empanelled, meghraj, government community cloud, gcc]
      existing: [state data centre, state data center, sdc, nic cloud, nic data centre, nic data center, provided by the department, provided by the client]
      on_prem: [on-premise, on premise, on-premises]
      aws: [amazon web services, aws, microsoft azure, azure, google cloud]
    support_hours:
      always: [24x7, 24 x 7, "24*7", 24/7, round the clock]
      office: [8x5, 8 x 5, office hours, working hours]

# Things a requirement document may ask for that this estimate does not price: shown to the
# user with the page, so nothing is silently left out (basic reader: these words; AI reader:
# the same topics). Labels are what the user sees.
not_priced_topics:
  penalties: {label: "Penalties for delay or downtime (service levels)", words: [liquidated damages, penalty, penalties, service level agreement, service levels, sla]}
  warranty: {label: Warranty period, words: [warranty, defect liability]}
  payment_terms: {label: "Payment terms (when the vendor is paid)", words: [payment terms, payment schedule, terms of payment, payment milestones]}
  data_rules: {label: "Data protection and other rules to follow", words: [dpdp, data protection, personal data protection, gdpr, iso 27001, pci dss, pci-dss, rbi guidelines]}
  technology: {label: Required technology or software, words: [technology stack, tech stack, oracle, microsoft sql server, sap hana]}
  team_qualifications: {label: "Required team qualifications or CVs", words: [curriculum vitae, cv of, cvs of, minimum experience, years of experience, key personnel]}
  source_code: {label: "Source code and ownership handover", words: [source code, intellectual property, ipr]}

# Staff the vendor must keep at the client's office, as stated in a document, are priced at
# this role's day rate during support (the engine's onsite_resources).
onsite_role: role.developer

# Payment terms read by the AI reader: when each payment falls, as a point in the build
# (0 = the order, 1 = go-live) and months after it. "after_go_live" uses the months the
# document states. Placeholder points.
payment_points:
  source: placeholder
  on_order: {at_build_fraction: 0, offset_months: 0}
  during_build: {at_build_fraction: 0.5, offset_months: 0}
  go_live: {at_build_fraction: 1, offset_months: 0}
  after_go_live: {at_build_fraction: 1, offset_months: 0}

# Pre-bid queries. Vague wording and missing key facts make bidders price differently; each
# becomes a drafted query citing the clause. {clause}, {page} and {quote} are filled in.
prebid:
  vague_phrases: [as per requirement, as per the requirement, as required, adequate, suitable, appropriate number, etc., to be decided, tbd, as directed, as and when required, if required, wherever applicable, and so on, minimum but not limited to, not limited to]
  vague_query: 'Clause {clause} (page {page}) states: "{quote}". The scope or quantity here is not specified. Kindly clarify the exact requirement so that all bidders can price on the same basis.'
  missing:
    users_total: The requirement document does not state the expected number of registered users. Kindly specify the number of users the system must support at launch and at the end of the contract.
    peak_concurrent_users: The requirement document does not state the expected number of concurrent users at peak load. Kindly specify it, as it determines the hosting and performance-testing scope.
    om_years: The requirement document does not state the period of operations and maintenance after go-live. Kindly confirm the O&M / AMC period.
    deadline_months: The requirement document does not state the implementation timeline. Kindly confirm the time allowed from the date of the work order to go-live.
    availability: The requirement document does not state the required system availability (uptime SLA). Kindly specify the uptime required and whether a disaster-recovery site is in scope.
    hosting: The requirement document does not state where the system will be hosted. Kindly confirm the hosting environment (government cloud, state data centre or bidder's cloud) and who bears the hosting cost.
    support_hours: The requirement document does not state the helpdesk support hours. Kindly confirm whether support is required during office hours or round the clock.
    chatbot_queries_per_day: The requirement document asks for an AI chatbot but does not state the expected usage. Kindly indicate the expected number of chatbot queries per day and the languages to be supported.
