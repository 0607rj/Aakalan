        adds: {integration_sms_email_gateway: basic}
        note: Priced as connecting an SMS / email service for the codes. The extra sign-in step itself is part of the user-accounts block; no source here prices it separately.
        partly_priced: true
        keywords: [multi-factor, multi factor, two-factor, two factor, 2fa, mfa]
      - key: enterprise_sso
        label: Single sign-on with the organisation's own login (SAML / OIDC, Active Directory)
        ask: "Staff log in with their office account"
        hint: "Uses the organisation's own login (Active Directory, SAML)."
        advanced: true
        adds: {integration_sso_identity: standard}   # ~127 h; the catalog's sources: 80-150 h
