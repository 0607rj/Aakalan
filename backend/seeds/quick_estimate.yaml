# Wording of the tendering process itself (OPEN_QUESTIONS 219; RailTel e-Empanelment tender p.10:
# "send your acknowledgement copy on our helpdesk e-mail address ... for activation of your
# account" set the helpdesk to yes). An answer quoting only such sentences, or contact details
# (an e-mail address, a phone number), is dropped. Lower case, matched inside the sentence.
tender_process:
  source: "placeholder, reasoned 2026-11-05: bid-process wording of Indian tender documents"
  # the steps of bidding only, never a portal's name: the software itself may have to connect to
  # e-tender portals or CPPP ("integration with ... e-tenders platform, CPPP")
  words: [bid submission, submission of bid, submission of the bid, submit the bid, submit their bid, registration payment, tender fee, tender document fee, acknowledgement copy, activation of your account, digital signature certificate, pre-bid meeting, bidders may, bidders are requested, bidders should, prospective bidders, gem helpdesk]

# The uptime a document asks for, read in code (services/extraction/uptime_terms.py,
# OPEN_QUESTIONS 219; RailTel e-Empanelment tender p.40: penalties start below 99.5%). It answers
# the downtime question with the lowest option that meets it, over the reading's answer.
uptime_terms:
  source: "placeholder, reasoned 2026-11-05: availability wording of SLA tables; 95% floor so a penalty share (0.5%, 5%) is never read as uptime"
  words: [availability, available, uptime, up-time, up time]
  window_chars: 200
  min_percent: "95"

# Support hours and dedicated support staff a document states, read in code on the page text
# (OPEN_QUESTIONS 157; RailTel e-Empanelment tender p.30: "Minimum 2 offsite support resources
# assigned to RailTel during business hours" and "Provide round-the-clock technical support").
support_terms:
  source: "RailTel e-Empanelment + Chatbot tender review (2026-10-23); phrase lists reasoned"
  ignore: [e-tender, e-tendering, e-nivida, e-procurement, bid submission, tender portal, cppp, gem portal, gem helpdesk]
  round_the_clock: [round-the-clock, round the clock, 24x7, "24 x 7", "24×7", "24*7", 24/7, 24x7x365, "24 x 7 x 365", 24 hours a day]
  # OPEN_QUESTIONS 162 rule 2: staffed round the clock only when the sentence says shifts or a
  # roster (a 24x7 helpdesk, call centre or "manned" desk alone is on call; a call-off team in
  # shifts is decided in staffing.py)
  staffed: [shift, shifts, per shift, roster, rostered]
  office_hours: [business hours, office hours, working hours]
  # an SLA response faster than this many hours, in a sentence about support, is answered on call
  fast_response_hours: 4
  # uptime and availability wording round the clock is on call, never staffed (rule 2)
  support_words: [support, maintenance, o&m, helpdesk, help desk, operations, post go-live, post-go-live, after go-live, post-platform delivery, uptime, availability]
  staff_words: [resources, resource, engineers, engineer, staff, personnel, manpower, persons, executives, professionals]
  dedicated: [dedicated, assigned, deployed, offsite, off-site, remote, minimum, at least, atleast]
  onsite: [onsite, on-site, on site, resident, at the client's office, at client premises, client's premises, client location]
  max_staff: 50
  max_sentence_chars: 400
  values: {office: office, on_call: on_call, always: always}
  conflict_query: "The document asks for support round the clock (as quoted) but also states support staff during business or office hours (as quoted). Kindly confirm whether support outside business hours is on call for urgent (severity 1) issues only, or a staffed shift, and how many people are expected outside business hours."

# Staff, support hours, helpdesk and chatbot level priced in code from the reading's staff lines
# (prompt v9) and the page text (services/extraction/staffing.py, OPEN_QUESTIONS 162). General
# rules for every tender, decided by the user on 2026-10-24:
# 1. a priced staff table or BoQ row wins over narrative terms; a narrative statement that
#    describes the same staff differently raises a pre-bid query; 2. staffed round the clock
#    only for a committed team in shifts or on a roster (support_terms.staffed); uptime or
#    availability wording is on call; 3. call-off staff (the buyer sets the headcount) are priced
#    as written, never multiplied by shifts, with a pre-bid query; a call-off team on 24x7 is on
#    call; a committed round-the-clock team stated per shift is priced as seats (people per seat:
#    parameters maintenance.helpdesk_coverage_fte 24x7); 4. place not stated: priced offsite, with
#    a pre-bid query; 5. how long comes from the staff line, not the contract; 6. an unclear
#    quantity is priced as read, with a pre-bid query; 7. helpdesk only for a complaint desk,
#    service desk or helpdesk staff; 8. chatbot "complex questions" only when it must connect to
#    the buyer's own systems. Pricing both readings (a wider range) stays off.
staffing:
  source: "User's rules (2026-10-24, docs/verification-sheet.md); phrase lists reasoned"
  # a sentence about support naming one of these asks for a helpdesk team (rule 7)
  helpdesk_words: [helpdesk, help desk, help-desk, service desk, complaint booking, complaint lodging, complaint desk, call centre, call center, contact centre, contact center]
  # onsite staff who do work the estimate prices anyway (OPEN_QUESTIONS 166, reasoned): an onsite
  # project manager or team leader is the O&M project manager; an onsite developer or support
  # engineer (L2 / L3) does the bug fixes, patches, upgrades and small changes. Helpdesk (L1),
  # analysts, designers and database administrators do other work and are priced in full.
  management_words: [project manager, team leader, team lead, programme manager, program manager, delivery manager]
  upkeep_words: [developer, developers, programmer, programmers, software engineer, support engineer, support engineers, technical support, l2, l3]
  queries:
    table_conflict: "The price schedule lists {table_role} ({table_count}, {table_place}; quoted on page {table_page}), while the terms on page {page} describe {count} {role} ({place}). Kindly confirm the number of resources, where they sit and for how long; we have priced the price schedule."
    call_off: "The document leaves the number of {role} to the Bank's or Department's discretion (page {page}). Kindly confirm the number of resources to be priced, their shifts and where they sit; we have priced {count} as written."
    call_off_hours: "The {role} are to work round the clock (page {page}) but their number is set by the Bank or Department. Kindly confirm whether a staffed round-the-clock team is required from the start, and how many people per shift; we have priced on-call support outside office hours."
    place_not_stated: "The document asks for {count} {role} (page {page}) but does not say whether they sit at the client's premises or offsite. Kindly confirm; we have priced them offsite."
    quantity_unclear: "The number for {role} on page {page} is not clear ({note}). Kindly confirm the number of people and for how long; we have priced {count} as read."

# Things a requirement document may ask for that this estimate does not price: shown to the
# user with the page, so nothing is silently left out (basic reader: these words; AI reader:
# the same topics). Labels are what the user sees.
not_priced_topics:
  penalties: {label: "Penalties for delay or downtime (service levels)", words: [liquidated damages, penalty, penalties, service level agreement, service levels, sla]}
  warranty: {label: Warranty period, words: [warranty, defect liability]}
  payment_terms: {label: "Payment terms (when the vendor is paid)", words: [payment terms, payment schedule, terms of payment, payment milestones]}
  data_rules: {label: "Data protection and other rules to follow", words: [dpdp, data protection, personal data protection, gdpr, iso 27001, pci dss, pci-dss, rbi guidelines]}
  technology: {label: Required technology or software, words: [technology stack, tech stack, oracle, microsoft sql server, sap hana]}
  team_qualifications: {label: "Required team qualifications or CVs", words: [curriculum vitae, cv of, cvs of, minimum experience, years of experience, key personnel]}
  source_code: {label: "Source code and ownership handover", words: [source code, intellectual property, ipr]}
  # Capabilities with no catalog block and no effort source yet: listed, never guessed.
  multi_tenancy: {label: "Several client organisations on one system (multi-tenant)", words: [multi-tenant, multi tenant, multitenant, multi-tenancy, tenant isolation, white-label, white label]}
  realtime_media: {label: "Video calls or live chat between users", words: [video call, video calls, video consultation, video consultations, teleconsultation, teleconsultations, tele-consultation, real-time chat, real time chat, live chat with]}
  health_standards: {label: "Health-record standards (HL7, FHIR, ABDM)", words: [hl7, fhir, abdm, abha]}

# Staff the vendor must keep at the client's office, as stated in a document, are priced at
# this role's day rate during support (the engine's onsite_resources).
onsite_role: role.developer
# Dedicated support staff a document states (offsite, or where they sit is not said) are priced
# at this role's day rate every support year, and they cover the helpdesk's office hours
# (engine maintenance.support_staff.v1 / maintenance.helpdesk.v3, OPEN_QUESTIONS 157).
support_role: role.developer
# Onsite staff needed only during an event or the launch (question onsite_period) when the
# document gives no number of days: priced for this many working days each, once.
onsite_event_days:
  days: 5
  source: "placeholder, reasoned: a convention or launch event of about 3 days plus set-up and wind-down (2026-10-22)"

# Payment terms read by the AI reader: when each payment falls, as a point in the build
# (0 = the order, 1 = go-live) and months after it. "after_go_live" uses the months the
# document states. Placeholder points.
payment_points:
  source: placeholder
  on_order: {at_build_fraction: 0, offset_months: 0}
  during_build: {at_build_fraction: 0.5, offset_months: 0}
  go_live: {at_build_fraction: 1, offset_months: 0}
  after_go_live: {at_build_fraction: 1, offset_months: 0}

# Pre-bid queries. Vague wording and missing key facts make bidders price differently; each
# becomes a drafted query citing the clause. {clause}, {page} and {quote} are filled in.
prebid:
  vague_phrases: [as per requirement, as per the requirement, as required, adequate, suitable, appropriate number, etc., to be decided, tbd, as directed, as and when required, if required, wherever applicable, and so on, minimum but not limited to, not limited to]
  vague_query: 'Clause {clause} (page {page}) states: "{quote}". The scope or quantity here is not specified. Kindly clarify the exact requirement so that all bidders can price on the same basis.'
  missing:
    users_total: The requirement document does not state the expected number of registered users. Kindly specify the number of users the system must support at launch and at the end of the contract.
    peak_concurrent_users: The requirement document does not state the expected number of concurrent users at peak load. Kindly specify it, as it determines the hosting and performance-testing scope.
    om_years: The requirement document does not state the period of operations and maintenance after go-live. Kindly confirm the O&M / AMC period.
    deadline_months: The requirement document does not state the implementation timeline. Kindly confirm the time allowed from the date of the work order to go-live.
    availability: The requirement document does not state the required system availability (uptime SLA). Kindly specify the uptime required and whether a disaster-recovery site is in scope.
    hosting: The requirement document does not state where the system will be hosted. Kindly confirm the hosting environment (government cloud, state data centre or bidder's cloud) and who bears the hosting cost.
    support_hours: The requirement document does not state the helpdesk support hours. Kindly confirm whether support is required during office hours or round the clock.
    chatbot_queries_per_day: The requirement document asks for an AI chatbot but does not state the expected usage. Kindly indicate the expected number of chatbot queries per day and the languages to be supported.
