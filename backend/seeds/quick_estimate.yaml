  ai_use:
    label: How much will the development team use AI tools (like Claude or Copilot)?
    topic: build
    group: hidden   # the company's own setting (Settings); the back-test sets it by award year
    default: medium
    options:
      - {value: none, label: Not at all, answers: {team_ai_maturity: none}}
      - {value: low, label: A little, answers: {team_ai_maturity: low}}
      - {value: medium, label: Regularly, answers: {team_ai_maturity: medium}}
      - {value: high, label: Heavily, answers: {team_ai_maturity: high}}

# "Not sure" answers price the usual answer but make the requirements less clear (1-5 scale),
# which widens the range and the risk buffer: clarity = max(min_clarity, requirement_clarity
# − ceil(not-sure answers / answers_per_step)).
not_sure:
  source: placeholder
  answers_per_step: 2
  min_clarity: 1
  # v19 (outside review): after an upload, what the document does not state and is priced at the
  # usual answer is open too, so it widens the range (raising the risk allowance), at most
  # assumed_max_steps steps (OPEN_QUESTIONS 139)
  assumed_per_step: 4
  assumed_max_steps: 1

# Ranking the open questions by price impact re-prices the form once per option. Fewer
# simulation runs keep it fast; a fixed seed keeps the ranking stable between requests.
impact:
  monte_carlo_runs: 500
  seed: 2026

# Countries the app prices for. Each has its own rate card and parameter set (region key),
# its currency, and the hosting options that make sense there.
countries:
  india: {label: India, currency: INR, hosting_options: [aws, indian_cloud, on_prem]}
  # The US is switched off for now (user's request, 2026-10-16): set enabled: true to bring it back.
  us: {label: United States, currency: USD, hosting_options: [aws, on_prem], enabled: false}

# Features the requirement document asks for that are not in the list above. The AI (or the
# user) gives each one a type and a size; the type picks a generic catalog component (catalog
# v2) and the size picks its S/M/L effort. Labels are what the user sees.
# What else a feature needs beyond its baseline (and sign-in, which every project has). Each
# item adds catalog building blocks at a level; their hours come from the catalog (with its
# sources), never from here. A block already in the project (a feature's, a standard block or
# another item's) is not added again: the larger level wins. Items not chosen are not priced;
# they do not change the project size (feature points). An item never makes a standard
# building block bigger (it may only ask for one at basic): a whole size step (e.g. user accounts
# S 76 h -> M 252 h) is a larger module, not the increment one item adds, and no source here
# prices such increments. `note` says what is and is not priced, in plain words (results and
# quote). On the form an item shows `ask` (plain words; else its `label`, which the quote prints)
# and `hint` (what it is, with an example). `advanced: true` items are folded under "For large or
# government projects" on the form; the rest of the every-project groups show as "Often needed"
# (OPEN_QUESTIONS 175).
scope_source: "Reasoned mapping of each item onto existing catalog blocks (catalog v6; v7 adds new blocks); placeholder until project hours are recorded"
scope:
  - key: sign_in
    label: Sign-in and user accounts
    feature: null   # every project: user accounts are a standard building block
    items:
      - key: otp_codes
        label: One-time codes by SMS or email (sign-in or password reset)
        ask: "Log in with a code sent by SMS or email"
        hint: "Like OTP login on banking apps. Also used to reset a password."
        adds: {integration_sms_email_gateway: basic}
        note: Priced as connecting an SMS / email service.
        keywords: [otp, one time password, one-time password]
      # roles and permissions are part of the user-accounts block at every size (its catalog
      # description), so they are not a separate item.
      - key: social_login
        label: Sign in with Google or Microsoft accounts
        ask: "Log in with a Google or Microsoft account"
        hint: "Users do not need to make a new password."
        adds: {integration_sso_identity: basic}
        note: Priced as a basic single sign-on connection.
        keywords: [social login, sign in with google, login with google, oauth]
      - key: two_step_sign_in
        label: Two-step sign-in (MFA)
        ask: "Two-step login"
        hint: "A password plus a code on the phone, for extra safety."
