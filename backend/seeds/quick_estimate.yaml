      - {value: up_to_5l, max_users: 500000, label: "1 lakh – 5 lakh", hint: "A large app or a big state service", answers: {users_total: 500000}, extra_components: [performance_load_testing]}
      - {value: up_to_10l, max_users: 1000000, label: "5 lakh – 10 lakh", hint: "A state-wide service", answers: {users_total: 1000000}, extra_components: [performance_load_testing]}
