  # The builder's profit (OPEN_QUESTIONS 227): one figure for everyone, never a choice. The
  # parameter set's 15% on cost = 13.0% of the price (15 / 115), checked against FY25 (year to
  # 31 March 2025) results of mid-size listed Indian IT firms, read on each page 2026-11-10.
  # "On cost" = m / (1 - m) of an operating margin m. Wording only; nothing is priced from here.
  margin:
