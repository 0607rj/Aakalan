      - {value: framework, label: Made faster with ready parts, hint: "Common screens like forms, lists and logins come ready-made; the rest is made for you (e.g. Django, Laravel, low-code tools)", answers: {build_type: framework}}
      - {value: cms, label: "On a website builder, with extra parts added", hint: "Pages, news and editing come ready; your own parts are added (e.g. WordPress or Drupal). Common for content-heavy websites", answers: {build_type: cms}}
      - {value: ready_product, label: An existing product set up for you, hint: "A ready product is set up with your settings (e.g. Shopify, a school or hospital product, a chatbot platform). Cheapest and fastest when your needs are standard; you work the product's way, and each feature of your own is still priced as extra work", answers: {build_type: ready_product}}
      - {value: not_sure, label: "Not sure: let the team decide", hint: "We price it made fully to order and show a wider range", unsure: true, answers: {build_type: custom}}
