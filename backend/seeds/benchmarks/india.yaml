# Indian benchmark contracts (researched 2026-10-16) for back-testing the estimator.
# `value_minor` is the published value in paise. `use` marks contracts comparable enough to tune
# on; others are kept for reference with the reason. `model` maps the published scope onto our
# quick-estimate form (a judgement from the scope text; scopes in order announcements are short).
# Most order announcements quote values including GST; when unstated we assume included.
country: india
currency: INR
tax_included_when_unknown: true
# AI coding tools: rare before 2023, spreading 2023-24, common from 2025 (assumption).
ai_adoption_by_year: {2020: none, 2023: low, 2025: medium}
# The back-test judges contracts awarded up to this year against our price without AI tools
# (priced before AI coding tools were common) and later ones (the last year or two) against our
# price with them; a project's own `pre_ai: true/false` overrides it. Reasoned, outside review
# 2026-10-23.
pre_ai_until: 2024
# Round 3 scoring (OPEN_QUESTIONS 151): published prices were costed on people's time, so our
# price with AI tools should come in below them by the AI saving. It is scored against the
# published price times this band (inside counts as exact); our price without AI tools is
# scored against the published price itself (target 1.0x).
ai_price_target:
  low: 0.75
  high: 0.80
  source: "placeholder: agreed with the product owner 2026-10-23 (the back-test showed our AI tools cut the price by about 20-25%)"
# Round 3 scope capture (OPEN_QUESTIONS 152): a feature can be several modules (`units`,
# `feature_units`). Rules, set from the scope text only, never from the price or the team size:
#   1. A named module of a state or enterprise system (treasury, registry, ERP) is a large
#      sub-system (L), as the catalog defines L.
#   2. A stated count of modules is priced as that many modules at the form's default level
#      (standard), less the ones already mapped to our features.
#   3. No module list or count stated: unchanged (a document re-read is needed to measure it).
# Which contracts are left out of the back-test (round 3, OPEN_QUESTIONS 155). A contract is
# used only when its published value is the price of a fixed piece of software we can describe
# on the form. Every project with `use: false` names one of these rules (`exclude_rule`) and its
# reason; the loader refuses one without. Applied to every project, not only new ones.
#   staffing          the main thing bought is people's time: staff by the month, time and
#                     material, team augmentation, or only a monthly rate. Staff bundled with a
#                     fixed build stay in when the tender states the headcount (priced as
#                     `onsite_staff`); out when it cannot be counted.
#   subscription      a subscription or licence of an existing product (SaaS, a platform
#                     bought through a reseller), not a build.
#   open_ended        a programme or operations of unknown length or scope, or build and ongoing
#                     work mixed without a split.
#   not_a_new_build   a rework, upgrade, migration, design only or frontend only.
#   unfinished        not finished when priced: spend to date, a first milestone, a failed project.
#   unreliable_price  the price cannot be matched to a scope: no scope beyond the title, a
#                     budget rather than a contract value, a band with a thin or vague scope,
#                     figures that contradict each other, too old, or client type or country
#                     unknown.
