# Indian benchmark contracts (researched 2026-10-16) for back-testing the estimator.
# `value_minor` is the published value in paise. `use` marks contracts comparable enough to tune
# on; others are kept for reference with the reason. `model` maps the published scope onto our
# quick-estimate form (a judgement from the scope text; scopes in order announcements are short).
# Most order announcements quote values including GST; when unstated we assume included.
