ounted. Commercial format also lists an onsite resources line with '5' near the years column and a note of minimum 3 staff; read as 3 staff for 5 years. Ready product: The CMS is a licensed (OEM) product that is configured and customised, not built from scratch: 'CMS should be support licensed', development 'will include incorporation of the proposed Out of the Box (OOTB) solutions, Customizations, Configurations', enterprise-wide all-inclusive perpetual licences with 1-year warranty + 4 years ATS, OEM to audit the implementation, commercial Table A 'Licensing Components'. Table A scoring gives full marks to features 'Available' in the product and half marks to 'Customisable' ones. The current site is WordPress on NGINX/PHP/MariaDB. (att01.pdf p.26, p.34, p.40, p.52, p.56, p.59, p.89-90, p.93)"
